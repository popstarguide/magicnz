": "2.45 hrs", "description": "You will follow Lake Wakatipu south passing Kingston and within about 30 min the hill fade behind you. This lower part of Southland is flat and easy to drive through.\n\nYou should easily arrive into Invercargill the home of Burt Munro. Burt set a land speed record in 1967 on his 1920’s Indian Scout motorbike at the age of 67. Hi story is endearing and nicely portrayed by Sir Anthony Hopkins in the move “The Worlds Fastest Indian”. Burts actual bike is on display in the local hardware store (which is well worth a visit).\n\nThe southern most point of Mainland New Zealand is Bluff which is a short 15-30 min drive south of Invercargill, Bluff is not only know for its location but also the Bluff Oysters which can be bought at a number fo local fish. and chip shops.", "kind": "drive"}, {"name": "Invercargill - Dunedin (via Catlins coast)", "distance": "258 kms", "duration": "4 hrs", "description": "This deceptively short drive is not an easy one in sections. If you want to get to Dunedin in time for a wildlife tour the afternoon of your arrival then follow State Highway straight through to Dunedin.\n\nIf you want to see the south eastern coast, the Catlins coast road will take you through the Catlins Forest. You will follow open pastoral land before entering the Catlins Forest. The road will twist and wind with lots of walks starting from the road side.\n\nTo be controversial because I know this region is the pride of the south and it well advertised. My recommendation is only take this route if you plan to camp and do a walk or two. Otherwise this is a whistle stop trip along a twisty road.\n\nRegardless which road you choose, you will arrive at Balclutha that is famous for its bridge crossing the Clutha River.\n\nA climb up the Mosgiel hill indicates you are on ythe outskirts of Dunedin.\n\nDunedin is the a city with and proud of its Scottish heritage and is often nicknamed the Edinburgh of the south. Look for the poet Robbie Burns in the middle of the octagon.", "kind": "drive"}, {"name": "Dunedin - Tekapo", "distance": "310 kms", "duration": "4 hrs", "description": "This drive will really have you wondering where in the world you are. \n\nLeaving the Otago harbour and Dunedin behind you. After climbing out of the city you’ll cruise easily along the coast road north until you get to Moeraki. Moreraki is famous for its round boulders imbedded in the sand.\n\nA short run north and Omarau is a town built literally on Limestone that for years the building material was knowns as Oamaru Stone. Do have a look at the Victorian quarter and the Steampunk Museum.\n\nTurning westward leads you up the Waitaki Valley, a valley that has been dammed for hydroelectric generation. I suggest you cross the Aviemore Dam take a photo and then cross back again and same again from the Benmore dam. Especially during summer do not be tempted to use the road linking the two dams, the area is where a lot of people holiday and the roads can be dangerous with all the walkers.\n\nAt the top of the valley is the Mackenzie Country, you are now high up on the eastern side of the Southern Alps. It is a landscape that is completely unexpected, with the tussock laden soft terrain laced with turquoise canals and rivers, backdropped by the big mountains.\n\nAbout 30 minutes before Tekapo is Lake Pukakai on a clear day you will be able to see and pick out Aoraki/Mt Cook (its the big mountain) at the head of the lake. This is a photo opportunity that if weather permits is not worth missing.\n\nTekapo is at the foot of Lake Tekapo and the base of Mt John. There is an ice rink and hot pools to ease tired muscles from the driving that can be found at the western end of the Campground..", "kind": "drive"}, {"name": "Tekapo - Christchurch", "distance": "230 kms", "duration": "3.25 hrs", "description": "Dropping down out of the alpine landscape you will notice the decent to the town of Fairlie. Fairlie Bakery is nationally famous for its pies - great late Breakfast or morning tea spot.\n\nFrom there my route will take you to Waitohi where all that is there is a weird statue of an airplane. This is the spot where Richard Pearce achieved powered flight in a heavier than air machine in 1903.\n\nOnto Geraldine for a refresh stop, There is lots of tourist shops due to the busses that stop here, but what is of interest is in the i-site is the worlds largest woollen knitted jumper.\n\nThe landscape becomes very flat upon leaving Geraldine as you cross the Canterbury plains and onto Christchurch.\n\nIf you leave Tekapo early morning you will comfortably arrive into Christchurch with enough time to look around and maybe get in a sight or two.", "kind": "drive"}, {"name": "Christchurch - Kaikōura", "distance": "180 km", "duration": "2.5 hrs", "description": "If you are hoping to see Whales or Dolphins in your afternoon at Kaikōura, then I recommend let the rush hour traffic drop away and then get out of the city and head north.\n\nPretty easy driving for most of the day, only a ridgeline to cross just before meeting the coast about 15-30 min south of Kaikōura.\n\nKaikoura is famous for its marine life, great sea food delicacies to nature observation of whales and swimming with dolpins.", "kind": "drive"}, {"name": "Kaikōura - Picton", "distance": "160 km", "duration": "2.25 hrs", "description": "You will have noticed that Kaikōura is between the top of the Southern Alps and the South Pacific Ocean. The road will twist and wind its way along the coast before about half way along your journey it will head inland.\n\nYou will know you are close to Blenheim because when you come off the Wither hills you will see vineyard after vineyard lining the road sides.\n\nIf you can afford the time a night in Blenheim to either do a wine tour and or visit Omaka World War One aviation museum is well worth the effort.", "kind": "drive"}, {"name": "Picton - Wellingon", "distance": "Ferry", "duration": "3 hrs", "description": "There is two ferry providers moving people and vehicles across the Cook Straight. the ferries take about 3 hours to cross the straight.", "kind": "ferry"}, {"name": "Wellington - Napier", "distance": "329 kms", "duration": "4 hrs", "description": "Heading out of Wellington is the twisty road that traverses the Rimutaka range, this is not a road to take lightly, in winter can be closed due to ice, snow and wind (at the same time).\n\nOnce over the range you will be in the farming region of the Wairapara, the road essentially follows a river basin through to Mt Bruce. Mt Bruce is the location but as a tourist you will really only notice the wildlife centre. I recommend a stop, they have kiwi and for many years this was the only place you’d be likely to see the famous bird.\n\nAfter leaving Waipukurau you will increasingly see vineyards that you drive by, these vineyards will be interlaced with orchards of various types of fruit.\n\nHastings is the southern of the two cities that make up this area. Close up the road is Napier. Both of these cities, although Napier promotes itself as such, are home to a lot of Art Deco style architecture. An Art Deco tour is well worth it in the afternoon of your arrival into Napier.", "kind": "drive"}, {"name": "Napier - Taupō", "distance": "144 kms", "duration": "2 hrs", "description": "A short but dramatic drive to Taupō, that can either be combined with continuing to Rotorua. Or just stopping at Taupō.\n\nTaupo is nestled on the shores of the largest volcanic lake in the world. Before arriving in the town do stop to see the Huka Falls and the Volcanic centre on the northern outskirts of the town.\n\nRock n Ropes adventure park is just north of Taupō and is a high adrenaline value for money activity (do book ahead).\n\nif you are wanting to do the Tongariro Crossing then you will need to stay in Taupō.", "kind": "drive"}, {"name": "Tongario Crossing", "distance": "Use bus transport", "duration": "10 hrs", "description": "The Tongariro Crossing is a one day alpine crossing that transverses Mt Tongariro. It is billed as one of the best most accessible alpine crossings in the world.\n\nLike all alpine activities it is very weather dependant as per its safety. You can drive yourself to the start.. but remember you will need to get from the end back to the start (its a one way trek).\n\nI recommend for safety, comfort and ease sake to use a transport operator out of Taupō or Tūrangi. They will take you to the start and pick you up at the end. Also inform you if it's unsafe", "kind": "activity"}, {"name": "Taupō - Rotorua", "distance": "80 kms", "duration": "1 hr", "description": "Taupō is nestled on the shores of the largest volcanic lake in the world. Before arriving in the town do stop to see the Huka Falls and the Volcanic centre on the northern outskirts of the town.\n\nRock n Ropes adventure park is just north of Taupō and is a high adrenaline value for money activity (do book ahead).\n\nWai o tapu geothermal reserve is a short drive south of Rotorua. Time your trip to either start or finish seeing the Lady Knox geyser erupt at 10:15 daily. Allow an hour for the park.\n\nRotorua and Taupō are both part of New Zealand's geothermal zone.", "kind": "drive"}, {"name": "Rotorua - Auckland", "distance": "230 kms", "duration": "2.45 hrs", "description": "Climb up out of the Rotorua caldera over the Mamaku Range and down into the Waikato. This road is a main tourist trail so is built for easy bus traffic.", "kind": "drive"}]}, {"id": "Possum", "name": "Possum", "days": "Minimum 24 days", "vehicle": "2001 Subaru WRX Impreza", "images": {"banner": "route_banners/possum_banner.jpg", "map": "route_maps/possum_map.png", "car": "route_cars/possum_car.jpg"}, "locations": [{"name": "Auckland", "slug": "auckland", "desc": "New Zealand's largest city, built around two harbours — for many, the gateway to the country."}, {"name": "Bay of Islands (Paihia)", "slug": "paihia_bay_of_islands", "desc": "Main hub for exploring the Bay of Islands — sailing, kayaking, and jet boating included."}, {"name": "Cape Reinga", "slug": "cape_reinga", "desc": "Where the Tasman and Pacific meet, the spiritual departure point for Māori spirits."}, {"name": "New Plymouth", "slug": "new_plymouth", "desc": "A city that punches above its weight for festivals, art, and genuinely world-class surf."}, {"name": "Wellington", "slug": "wellington", "desc": "New Zealand's capital, and worth a full day on its own for Te Papa and Weta Workshop."}, {"name": "Picton", "slug": "picton", "desc": "South Island terminal for the Interislander ferry, and gateway to the Marlborough Sounds."}, {"name": "Nelson", "slug": "nelson", "desc": "New Zealand's sunniest city, and gateway to Abel Tasman National Park."}, {"name": "Greymouth", "slug": "greymouth", "desc": "Largest town on the West Coast, and western terminus of the TranzAlpine train journey."}, {"name": "Franz Josef", "slug": "franz_josef_glacier", "desc": "One of the most accessible glaciers in the world."}, {"name": "Wānaka", "slug": "wanaka", "desc": "A quieter alternative to Queenstown, with lake activities and ski fields nearby."}, {"name": "Queenstown", "slug": "queenstown", "desc": "New Zealand's adventure tourism hub, on the shores of Lake Wakatipu."}, {"name": "Milford Sound", "slug": "milford_sound_self_drive_day_trip", "desc": "Home to Mitre Peak, one of the most photographed landmarks in the country."}, {"name": "Invercargill", "slug": "invercargill", "desc": "New Zealand's southernmost city, and home town of Burt Munro of the Worlds Fastest Indian fame."}, {"name": "Dunedin", "slug": "dunedin", "desc": "A Scottish-built university city, with wildlife tours nearby a real highlight."}, {"name": "Lake Tekapo", "slug": "lake_tekapo", "desc": "A stunning lakeside town and one of the best stargazing spots in the world."}, {"name": "Christchurch", "slug": "christchurch", "desc": "Planned as an English city on the Canterbury Plains, rebuilding after the 2011 earthquake."}, {"name": "Kaikōura", "slug": "kaikoura", "desc": "The place to see whales and dolphins up close, right off the coast."}, {"name": "Napier", "slug": "napier", "desc": "Rebuilt in Art Deco after the 1931 quake, now the densest collection of Art Deco architecture anywhere."}, {"name": "Gisborne", "slug": "gisborne", "desc": "A small city on Poverty Bay, and gateway to the East Cape's great coastal drive."}, {"name": "Rotorua", "slug": "rotorua", "desc": "The country's geothermal heartland, and the easiest place to experience Māori culture."}, {"name": "Taupō", "slug": "taup", "desc": "Sits on Lake Taupō, with trout fishing, skydiving, and geothermal pools minus Rotorua's smell."}], "journeys": [{"name": "Auckland - Pahia (via Opononi)", "distance": "363 km", "duration": "5.5 hrs", "description": "Depart Auckland, home to approximately a third of New Zealand's population and is the countries largest city. Auckland is amongst the largest cities geographically per population and is the largest Polynesian city in the world. On a global population scale is relatively small with around 3.5 million people.\n\nIf you start your journey to sit on the tail of the morning rush hour you should arrive in Matakohe for morning tea. with enough time to see the Kauri museum.\n\nAim to get to Waipoua Forest and see Tāne Mahuta  before a quick bite for a late lunch at Opononi. tane Mahuta is the largest tree per volume in the Southern Hemisphere. Do take the time to explore the Opononi I-Site and learn about its once famous dolphin - Opo.\n\nThis should have you arriving into the stunning Paihia late afternoon. Nestled in the heart of the Bay of Islands Paihia sits on the shores of stunning white calm beaches with many activities to explore the region on offer.", "kind": "drive"}, {"name": "Pahia - Cape Reinga - Pahia", "distance": "395 km", "duration": "5.5 hrs", "description": "Follow State Highway 1 north to Kaitaia, Overall this is a comfortable drive with the Manganoka range providing a bit of slow driving just south of Kaitaia.\n\nKaitaia the northern most township in the region, is a good place to ensure you have a full tank or charge in your vehicle before heading north.\n\nA lot of Northlands early infrastructure was built on the Kauri industry, you will find a few accessible Kauri shops on your drive out of town.\n\nCape Reinga is the northernmost point of New Zealand and the Māori believe that when they die their spirit will depart to Hawaiki their spiritual homeland from this point. A picturesque lighthouse is near to the departure point.\n\nReturn back to Paihia via the Eastern coast road, Mangaoui is famous for its fish and chips, many tour busses will stop so expect the town to be busy.", "kind": "daytrip"}, {"name": "Paihia - Auckland", "distance": "227 km", "duration": "3.25 hrs", "description": "A reasonably easy drive south will take you through Whangarei, the financial centre for Northland.\n\nYou should arrive in Auckland with plenty of time to take in a visit to MOTAT, or Kelly Tarlton’s, or maybe do the Skytower jump.", "kind": "drive"}, {"name": "Auckland - New Plymouth", "distance": "358 kms", "duration": "4.5 hrs", "description": "Allow the chaos of morning rush hour traffic to calm down then head south to Waitomo Caves.\n\nExplore the Waitomo Caves, which is clearly signposted just past the small village. Fo those with time and are adventurous spending the night here could allow you to experience the caves differently from the mainstream. Black water rafting which is riding the underground streams in a personal raft is a popular option or abseiling into the caves and doing a bit of spelunking you way back out of the caves is a highlight you wont forget.\n\nContinue your journey south will take you through the King Country into the Awakino George, a road that follows the river to the sea. On clear days you will break out of the inland part of the drive and be treated to stunning views of Mt Taranaki across the North Taranaki bight.\n\nFollow the coast south and arrive into New Plymouth. New Plymouth and the Taranaki region have been famous in New Zealand for Dairy products and oil & gas. The relaxed town is settled seaside and is home to some accessible surf.", "kind": "drive"}, {"name": "New Plymouth - Wellington", "distance": "382 kms", "duration": "5 hrs", "description": "Depending on time you have the choice which way to see Taranaki either around Surf Highway 45 or the “main road” State Highway 3.\n\nSurf Highway will take you round Mt Taranaki and despite ist name you’re not likely to see much surf, but you will see some interesting geography thats been created by the mountain.\n\nState Highway 3 will take you through the more populated route and the shakespearian town of Stratford.\n\nBoth routes will meet at Hawera and you will have reasonably comfortable drive south.\n\nWhanganui is a town built around the river which you will have to cross to head south.\n\nUnless you need to go to Palmerston North you probably will head straight to Wellington.\n\nWellington a city often overlooked is well worth a day to visit Te Papa the national museum, or explore the rug- ged hills that the city is built on. It is also the capital city of New Zealand.", "kind": "drive"}, {"name": "Wellington - Picton", "distance": "Ferry", "duration": "3 hrs", "description": "There is two ferry providers moving people and vehicles across the Cook Straight. the ferries take about 3 hours to cross the straight.", "kind": "ferry"}, {"name": "Picton - Nelson", "distance": "140 kms", "duration": "2.5 hrs", "description": "You will quickly notice a change in the landscape from the North Island. Arriving in Picton that is deep in the Marlborough Sounds, quickly popping out into the Marlborough flats wine region.\n\nOnce you get past Havelock (the self proclaimed green lipped mussel capital of New Zealand) you will need to cross the northern part of the Southern Alps with a series of climbs and descents that twist and wind their way up and through valleys, until you get to the sheltered city of Nelson.\n\nNelson is the geographical centre of New Zealand and the gateway to the Abel Tasman National Park. The national park offers accessible walks that vary from a day walk to several days.", "kind": "drive"}, {"name": "Nelson - Greymouth (via Westport)", "distance": "300 kms", "duration": "4.5 hrs", "description": "While ‘only 4.5hrs’ driving I would get underway after an early breakfast, follow the valleys out of town.\n\nA quick photo stop at the top of the Hope Saddle then follow the Buller river to Westport. Do look out for a spot called Hawkes Craig, the scenic and interesting spot is a particularly narrow bit of road.\n\nIf you arrive at Westport late morning, you could fit in a trip to to Denniston and old abandoned coal mine (allow a couple of hours).\n\nHead to Cape Foul wind where you can see the Kekerengu (NZ Fur seal) before tracking south to Punakaiki for the pancake rocks.\n\nGreymouth the largest town of the West Coast straddles the Grey river and is a comfortable place to finish your day.\n\nIf you have the time and are interested in trains you can catch the train to Christchurch return, the full day rail trip known as the TransAlpine transverses some stunning scenery.", "kind": "drive"}, {"name": "Greymouth - Franz Josef", "distance": "180 kms", "duration": "2.5 hrs", "description": "A short drive day, but if you are running to minimum time frames, I suggest get travelling by 0900. Stop in either Hokitika or Ross (30-45 min from Greymouth) and learn about the beautiful rock Pounamu (greenstone/jade) that is found in the region.\n\nThen head south to Franz Josef. This will get you into the glacier town to explore the glacier that afternoon.\n\nMAKE SURE YOU READ THE SECTION ON THE GLACIERS that can be found in the Locations section before you venture onto them.", "kind": "drive"}, {"name": "Franz Josef - Wānaka", "distance": "290 kms", "duration": "4.25 hrs", "description": "Either have breakfast before you leave or aim for the Lake Mathieson cafe and grab a bite there. The cafe is at the start/end of a half out walk that will take you to a stunning vantage point of Mt Cook and Mt Tasman reflecting in the lake.\n\nTracking alongside the Southern Alps you will follow the twisty West Coast road back through the town of Fox Glacier onto Haast. There will be many photo opportunities along the way.\n\nAt Haast the road turns inland and heads up the towards the pass, as it does so follows the Haast river.\n\nOnce crossed the pass you will follow the Makaroa river through the ranges until you get to the neck of lake Wānaka. You’ll cross the Neck and then trace the shores of Lake Hāwea before passing by Hāwea town and onto Wānaka town.\n\nThe alpine town of Wānaka has been for many years the New Zealanders winter get away, but word has got out and many international tourists flock here as well. Two ski commercial ski fields as accessed from Wānaka.", "kind": "drive"}, {"name": "Wānaka - Queenstown", "distance": "80 kms", "duration": "1.5 hrs", "description": "Following the Cardrona Valley you will pass the Cardrona Ski field, opposite the valley from the ski field is where the race to the sky is held and were Possum Bourne tragically died competing in the hill climb event.\n\nCrossing the Crowne Range has you descending toward the Kawarau River. Take care on the section of the road known as the switchbacks, the road hugs the hill and winds back and forth on itself, busses will use the whole road to get around the corners.\n\nAt the bottom of the Crowne Range you can turn left and a quick 10 min up the road is the original A J Hackett Bungie bridge. Otherwise turning right will take you to Queenstown. You can follow the road to Arrowtown or stay on the main road that will take you to the resort town of Queenstown.", "kind": "drive"}, {"name": "Queenstown - Milford Sound", "distance": "287 Kms", "duration": "4.5 hrs", "description": "This is a big day of driving and including a boat cruise in Milford Sound is best left to the professional drivers.\n\nThis road is dangerous not only because of the terrain, but more because of distracted drivers and tired drivers.\n\nIf you wish to drive this yourself please read the Milford Sound Day trip section in “Locations”.\n\nThe day trip into Milford Sound is well worth the time and energy, it traverses stunning landscape that changes by the hour with weather and time of the day.", "kind": "daytrip"}, {"name": "Queenstown - Invercargill", "distance": "181 kms", "duration": "2.45 hrs", "description": "You will follow Lake Wakatipu south passing Kingston and within about 30 min the hill fade behind you. This lower part of Southland is flat and easy to drive through.\n\nYou should easily arrive into Invercargill the home of Burt Munro. Burt set a land speed record in 1967 on his 1920’s Indian Scout motorbike at the age of 67. Hi story is endearing and nicely portrayed by Sir Anthony Hopkins in the move “The Worlds Fastest Indian”. Burts actual bike is on display in the local hardware store (which is well worth a visit).\n\nThe southern most point of Mainland New Zealand is Bluff which is a short 15-30 min drive south of Invercargill, Bluff is not only know for its location but also the Bluff Oysters which can be bought at a number fo local fish. and chip shops.", "kind": "drive"}, {"name": "Invercargill - Dunedin (via Catlins coast)", "distance": "258 kms", "duration": "4 hrs", "description": "This deceptively short drive is not an easy one in sections. If you want to get to Dunedin in time for a wildlife tour the afternoon of your arrival then follow State Highway straight through to Dunedin.\n\nIf you want to see the south eastern coast, the Catlins coast road will take you through the Catlins Forest. You will follow open pastoral land before entering the Catlins Forest. The road will twist and wind with lots of walks starting from the road side.\n\nTo be controversial because I know this region is the pride of the south and it well advertised. My recommendation is only take this route if you plan to camp and do a walk or two. Otherwise this is a whistle stop trip along a twisty road.\n\nRegardless which road you choose, you will arrive at Balclutha that is famous for its bridge crossing the Clutha River.\n\nA climb up the Mosgiel hill indicates you are on ythe outskirts of Dunedin.\n\nDunedin is the a city with and proud of its Scottish heritage and is often nicknamed the Edinburgh of the south. Look for the poet Robbie Burns in the middle of the octagon.", "kind": "drive"}, {"name": "Dunedin - Tekapo", "distance": "310 kms", "duration": "4 hrs", "description": "This drive will really have you wondering where in the world you are. \n\nLeaving the Otago harbour and Dunedin behind you. After climbing out of the city you’ll cruise easily along the coast road north until you get to Moeraki. Moreraki is famous for its round boulders imbedded in the sand.\n\nA short run north and Omarau is a town built literally on Limestone that for years the building material was knowns as Oamaru Stone. Do have a look at the Victorian quarter and the Steampunk Museum.\n\nTurning westward leads you up the Waitaki Valley, a valley that has been dammed for hydroelectric generation. I suggest you cross the Aviemore Dam take a photo and then cross back again and same again from the Benmore dam. Especially during summer do not be tempted to use the road linking the two dams, the area is where a lot of people holiday and the roads can be dangerous with all the walkers.\n\nAt the top of the valley is the Mackenzie Country, you are now high up on the eastern side of the Southern Alps. It is a landscape that is completely unexpected, with the tussock laden soft terrain laced with turquoise canals and rivers, backdropped by the big mountains.\n\nAbout 30 minutes before Tekapo is Lake Pukakai on a clear day you will be able to see and pick out Aoraki/Mt Cook (its the big mountain) at the head of the lake. This is a photo opportunity that if weather permits is not worth missing.\n\nTekapo is at the foot of Lake Tekapo and the base of Mt John. There is an ice rink and hot pools to ease tired muscles from the driving that can be found at the western end of the Campground..", "kind": "drive"}, {"name": "Tekapo - Christchurch", "distance": "230 kms", "duration": "3.25 hrs", "description": "Dropping down out of the alpine landscape you will notice the decent to the town of Fairlie. Fairlie Bakery is nationally famous for its pies - great late Breakfast or morning tea spot.\n\nFrom there my route will take you to Waitohi where all that is there is a weird statue of an airplane. This is the spot where Richard Pearce achieved powered flight in a heavier than air machine in 1903.\n\nOnto Geraldine for a refresh stop, There is lots of tourist shops due to the busses that stop here, but what is of interest is in the i-site is the worlds largest woollen knitted jumper.\n\nThe landscape becomes very flat upon leaving Geraldine as you cross the Canterbury plains and onto Christchurch.\n\nIf you leave Tekapo early morning you will comfortably arrive into Christchurch with enough time to look around and maybe get in a sight or two.", "kind": "drive"}, {"name": "Christchurch - Kaikōura", "distance": "180 km", "duration": "2.5 hrs", "description": "If you are hoping to see Whales or Dolphins in your afternoon at Kaikōura, then I recommend let the rush hour traffic drop away and then get out of the city and head north.\n\nPretty easy driving for most of the day, only a ridgeline to cross just before meeting the coast about 15-30 min south of Kaikōura.\n\nKaikoura is famous for its marine life, great sea food delicacies to nature observation of whales and swimming with dolpins.", "kind": "drive"}, {"name": "Kaikōura - Picton", "distance": "160 km", "duration": "2.25 hrs", "description": "You will have noticed that Kaikōura is between the top of the Southern Alps and the South Pacific Ocean. The road will twist and wind its way along the coast before about half way along your journey it will head inland.\n\nYou will know you are close to Blenheim because when you come off the Wither hills you will see vineyard after vineyard lining the road sides.\n\nIf you can afford the time a night in Blenheim to either do a wine tour and or visit Omaka World War One aviation museum is well worth the effort.", "kind": "drive"}, {"name": "Picton - Wellingon", "distance": "Ferry", "duration": "3 hrs", "description": "There is two ferry providers moving people and vehicles across the Cook Straight. the ferries take about 3 hours to cross the straight.", "kind": "ferry"}, {"name": "Wellington - Napier", "distance": "329 kms", "duration": "4 hrs", "description": "Heading out of Wellington is the twisty road that traverses the Rimutaka range, this is not a road to take lightly, in winter can be closed due to ice, snow and wind (at the same time).\n\nOnce over the range you will be in the farming region of the Wairapara, the road essentially follows a river basin through to Mt Bruce. Mt Bruce is the location but as a tourist you will really only notice the wildlife centre. I recommend a stop, they have kiwi and for many years this was the only place you’d be likely to see the famous bird.\n\nAfter leaving Waipukurau you will increasingly see vineyards that you drive by, these vineyards will be interlaced with orchards of various types of fruit.\n\nHastings is the southern of the two cities that make up this area. Close up the road is Napier. Both of these cities, although Napier promotes itself as such, are home to a lot of Art Deco style architecture. An Art Deco tour is well worth it in the afternoon of your arrival into Napier.", "kind": "drive"}, {"name": "Napier - Gisborne", "distance": "251 kms", "duration": "3.25 hrs", "description": "The drive from Napier to Gisborne is one of easy smooth driving mixed with winding roads traversing ridges and ranges.\n\nYou are entering a part of New Zealand largely untouched by tourism. For years the region depended on sheep and beef production and forestry. You will see meat processing plants and remnants of, as well as Trucks ladened with sheep, cows or logs.\n\nCows that are raised for their meat in New Zealand are referred to as cattle or beef animals. So trucks you see with sheep or beef animals on are called Cattle Trucks. Watch as they go past you, see if you can see the drivers dog excitedly poking their head out from a box under the truck.\n\nGisborne is a city that feels remote (for New Zealand) three slow to drive roads lead to the city. Apart from an annual New Years Music Festival Gisborne is largely an economic centre for a rural community.\n\nThis is the New Zealand from the 1970 and 1980’s, this is not ment in a bad way, just don’t expect flashy tourist bars, hotels and attractions. You will find modest accommodation and respectful nods to its past.", "kind": "drive"}, {"name": "Gisborne - Rotorua", "distance": "458 kms", "duration": "7 hrs", "description": "This is a big day to do in one drive, unfortunately accommodation can be difficult to find if you are not brining your own accommodation. If you do some research before you go if you want to break this trip up, some camp grounds have cabins available.\n\nThis drive will give your arms a good work out, its a winding road for most of it. But The scenery is amazing and you will see and drive past Māori Marae, some have amazingly carved Wharetupuna. Please be respectful of these locations do not just walk into the grounds around them. There is protocol to follow to enter.\n\nDo not be surprised to find the locals to be riding horseback up the main street. DO NOT speed, rev your engine, toot your horn around horses.\n\nState Highway 35 winds it way through, around and past some stunningly remote beautiful landscapes. Just out or Ruatoria is  a mountain that is the first part of New Zealand to see the sun (and until the International Date Line moved, the world) every day.\n\nYou will feel a change in the landscape as you move from the wild East Cape to the Bay of Plenty, the calmer pristine beaches looking out at White Island. Taikia Wai-iti's film “Boy” was filmed on this coast.\n\nIt may be tempting to spend the night at Ōpōtiki or Whakatāne, and if you have the time, thats a great idea. But if you don’t have the flexibility, keep moving through to Rotorua.\n\nThis will mean the following day you can enjoy the geothermal delights and Māori Cultural shows without rushing.\n\nWhile I hae indicated 7 hrs driving as a reminder this is drive time so not including stops etc allow 9-10 for this day.", "kind": "drive"}, {"name": "Tongario Crossing", "distance": "Use bus transport", "duration": "10 hrs", "description": "The Tongariro Crossing is a one day alpine crossing that transverses Mt Tongariro. It is billed as one of the best most accessible alpine crossings in the world.\n\nLike all alpine activities it is very weather dependant as per its safety. You can drive yourself to the start.. but remember you will need to get from the end back to the start (its a one way trek).\n\nI recommend for safety, comfort and ease sake to use a transport operator out of Taupō or Tūrangi. They will take you to the start and pick you up at the end. Also inform you if it's unsafe", "kind": "activity"}, {"name": "Rotorua - Taupō", "distance": "80 km", "duration": "1 hr", "description": "Rotorua and Taupō are both part of New Zealand's geothermal zone. \n\nWai o tapu geothermal reserve is a short drive south of Rotorua. Time your trip to either start or finish seeing the Lady Knox geyser erupt at 10:15 daily. Allow an hour for the park.\n\nRock n Ropes adventure park is just north of Taupō and is a high adrenaline value for money activity (do book ahead).\n\nTaupo is nestled on the shores of the largest volcanic lake in the world. Before arriving in the town do stop to see the Huka Falls and the Volcanic centre on the northern outskirts of the town.", "kind": "drive"}, {"name": "Taupō - Auckland", "distance": "272 kms", "duration": "3.5 hrs", "description": "Following State Highway north through forestry landscapes leads into rolling dairy farm lands. Aim to stop at Tirau and see the buildings like sheep and dog that house the i-site. Once north of the Tirau most of this road is now whats known as the Waikato Expressway leading into the Auckland Expressway. It will be multilane smooth driving.", "kind": "drive"}]}, {"id": "Bruce", "name": "Bruce", "days": "Minimum 26 days", "vehicle": "McLaren M6B", "images": {"banner": "route_banners/bruce_banner.jpg", "map": "route_maps/bruce_map.png", "car": "route_cars/bruce_car.jpg"}, "locations": [{"name": "Auckland", "slug": "auckland", "desc": "New Zealand's largest city, built around two harbours — for many, the gateway to the country."}, {"name": "Bay of Islands (Paihia)", "slug": "paihia_bay_of_islands", "desc": "Main hub for exploring the Bay of Islands — sailing, kayaking, and jet boating included."}, {"name": "Cape Reinga", "slug": "cape_reinga", "desc": "Where the Tasman and Pacific meet, the spiritual departure point for Māori spirits."}, {"name": "New Plymouth", "slug": "new_plymouth", "desc": "A city that punches above its weight for festivals, art, and genuinely world-class surf."}, {"name": "Wellington", "slug": "wellington", "desc": "New Zealand's capital, and worth a full day on its own for Te Papa and Weta Workshop."}, {"name": "Picton", "slug": "picton", "desc": "South Island terminal for the Interislander ferry, and gateway to the Marlborough Sounds."}, {"name": "Nelson", "slug": "nelson", "desc": "New Zealand's sunniest city, and gateway to Abel Tasman National Park."}, {"name": "Abel Tasman National Park", "slug": "abel_tasman_national_park", "desc": "New Zealand's smallest national park, best explored by boat and coastal walk."}, {"name": "Greymouth", "slug": "greymouth", "desc": "Largest town on the West Coast, and western terminus of the TranzAlpine train journey."}, {"name": "Franz Josef", "slug": "franz_josef_glacier", "desc": "One of the most accessible glaciers in the world."}, {"name": "Wānaka", "slug": "wanaka", "desc": "A quieter alternative to Queenstown, with lake activities and ski fields nearby."}, {"name": "Queenstown", "slug": "queenstown", "desc": "New Zealand's adventure tourism hub, on the shores of Lake Wakatipu."}, {"name": "Milford Sound", "slug": "milford_sound_self_drive_day_trip", "desc": "Home to Mitre Peak, one of the most photographed landmarks in the country."}, {"name": "Invercargill", "slug": "invercargill", "desc": "New Zealand's southernmost city, and home town of Burt Munro of the Worlds Fastest Indian fame."}, {"name": "Dunedin", "slug": "dunedin", "desc": "A Scottish-built university city, with wildlife tours nearby a real highlight."}, {"name": "Lake Tekapo", "slug": "lake_tekapo", "desc": "A stunning lakeside town and one of the best stargazing spots in the world."}, {"name": "Christchurch", "slug": "christchurch", "desc": "Planned as an English city on the Canterbury Plains, rebuilding after the 2011 earthquake."}, {"name": "Kaikōura", "slug": "kaikoura", "desc": "The place to see whales and dolphins up close, right off the coast."}, {"name": "Napier", "slug": "napier", "desc": "Rebuilt in Art Deco after the 1931 quake, now the densest collection of Art Deco architecture anywhere."}, {"name": "Gisborne", "slug": "gisborne", "desc": "A small city on Poverty Bay, and gateway to the East Cape's great coastal drive."}, {"name": "Rotorua", "slug": "rotorua", "desc": "The country's geothermal heartland, and the easiest place to experience Māori culture."}, {"name": "Taupō", "slug": "taup", "desc": "Sits on Lake Taupō, with trout fishing, skydiving, and geothermal pools minus Rotorua's smell."}, {"name": "Coromandel Town", "slug": "coromandel_town", "desc": "Oldest gold mining town on the Coromandel, now home to mussel farms and quirky local attractions."}], "journeys": [{"name": "Auckland - Pahia (via Opononi)", "distance": "363 km", "duration": "5.5 hrs", "description": "Depart Auckland, home to approximately a third of New Zealand's population and is the countries largest city. Auckland is amongst the largest cities geographically per population and is the largest Polynesian city in the world. On a global population scale is relatively small with around 3.5 million people.\n\nIf you start your journey to sit on the tail of the morning rush hour you should arrive in Matakohe for morning tea. with enough time to see the Kauri museum.\n\nAim to get to Waipoua Forest and see Tāne Mahuta  before a quick bite for a late lunch at Opononi. tane Mahuta is the largest tree per volume in the Southern Hemisphere. Do take the time to explore the Opononi I-Site and learn about its once famous dolphin - Opo.\n\nThis should have you arriving into the stunning Paihia late afternoon. Nestled in the heart of the Bay of Islands Paihia sits on the shores of stunning white calm beaches with many activities to explore the region on offer.", "kind": "drive"}, {"name": "Pahia - Cape Reinga - Pahia", "distance": "395 km", "duration": "5.5 hrs", "description": "Follow State Highway 1 north to Kaitaia, Overall this is a comfortable drive with the Manganoka range providing a bit of slow driving just south of Kaitaia.\n\nKaitaia the northern most township in the region, is a good place to ensure you have a full tank or charge in your vehicle before heading north.\n\nA lot of Northlands early infrastructure was built on the Kauri industry, you will find a few accessible Kauri shops on your drive out of town.\n\nCape Reinga is the northernmost point of New Zealand and the Māori believe that when they die their spirit will depart to Hawaiki their spiritual homeland from this point. A picturesque lighthouse is near to the departure point.\n\nReturn back to Paihia via the Eastern coast road, Mangaoui is famous for its fish and chips, many tour busses will stop so expect the town to be busy.", "kind": "daytrip"}, {"name": "Paihia - Auckland", "distance": "227 km", "duration": "3.25 hrs", "description": "A reasonably easy drive south will take you through Whangarei, the financial centre for Northland.\n\nYou should arrive in Auckland with plenty of time to take in a visit to MOTAT, or Kelly Tarlton’s, or maybe do the Skytower jump.", "kind": "drive"}, {"name": "Auckland - New Plymouth", "distance": "358 kms", "duration": "4.5 hrs", "description": "Allow the chaos of morning rush hour traffic to calm down then head south to Waitomo Caves.\n\nExplore the Waitomo Caves, which is clearly signposted just past the small village. Fo those with time and are adventurous spending the night here could allow you to experience the caves differently from the mainstream. Black water rafting which is riding the underground streams in a personal raft is a popular option or abseiling into the caves and doing a bit of spelunking you way back out of the caves is a highlight you wont forget.\n\nContinue your journey south will take you through the King Country into the Awakino George, a road that follows the river to the sea. On clear days you will break out of the inland part of the drive and be treated to stunning views of Mt Taranaki across the North Taranaki bight.\n\nFollow the coast south and arrive into New Plymouth. New Plymouth and the Taranaki region have been famous in New Zealand for Dairy products and oil & gas. The relaxed town is settled seaside and is home to some accessible surf.", "kind": "drive"}, {"name": "New Plymouth - Wellington", "distance": "382 kms", "duration": "5 hrs", "description": "Depending on time you have the choice which way to see Taranaki either around Surf Highway 45 or the “main road” State Highway 3.\n\nSurf Highway will take you round Mt Taranaki and despite ist name you’re not likely to see much surf, but you will see some interesting geography thats been created by the mountain.\n\nState Highway 3 will take you through the more populated route and the shakespearian town of Stratford.\n\nBoth routes will meet at Hawera and you will have reasonably comfortable drive south.\n\nWhanganui is a town built around the river which you will have to cross to head south.\n\nUnless you need to go to Palmerston North you probably will head straight to Wellington.\n\nWellington a city often overlooked is well worth a day to visit Te Papa the national museum, or explore the rug- ged hills that the city is built on. It is also the capital city of New Zealand.", "kind": "drive"}, {"name": "Wellington - Picton", "distance": "Ferry", "duration": "3 hrs", "description": "There is two ferry providers moving people and vehicles across the Cook Straight. the ferries take about 3 hours to cross the straight.", "kind": "ferry"}, {"name": "Picton - Nelson", "distance": "140 kms", "duration": "2.5 hrs", "description": "You will quickly notice a change in the landscape from the North Island. Arriving in Picton that is deep in the Marlborough Sounds, quickly popping out into the Marlborough flats wine region.\n\nOnce you get past Havelock (the self proclaimed green lipped mussel capital of New Zealand) you will need to cross the northern part of the Southern Alps with a series of climbs and descents that twist and wind their way up and through valleys, until you get to the sheltered city of Nelson.\n\nNelson is the geographical centre of New Zealand and the gateway to the Abel Tasman National Park. The national park offers accessible walks that vary from a day walk to several days.", "kind": "drive"}, {"name": "Nelson - Abel Tasman National Park (Marahau)", "distance": "75 kms", "duration": "1.25 hrs", "description": "The drive to Marahau takes you through horticultural lands growing fruit and hops. Be patient this road is often busy and slow driving (Its worth noting the Police know many are not patient on this road).\n\nThere is water taxis that shuttle you up the park, which means you only have to walk back to your car. The popular Bark bay to carpark is 4hrs one way.\n\nIf you don’t want to think to much about organisation, there is bus trips that will book water taxis for you. The busses depart from Nelson and return you to Nelson at the end of the day.", "kind": "daytrip"}, {"name": "Nelson - Greymouth (via Westport)", "distance": "300 kms", "duration": "4.5 hrs", "description": "While ‘only 4.5hrs’ driving I would get underway after an early breakfast, follow the valleys out of town.\n\nA quick photo stop at the top of the Hope Saddle then follow the Buller river to Westport. Do look out for a spot called Hawkes Craig, the scenic and interesting spot is a particularly narrow bit of road.\n\nIf you arrive at Westport late morning, you could fit in a trip to to Denniston and old abandoned coal mine (allow a couple of hours).\n\nHead to Cape Foul wind where you can see the Kekerengu (NZ Fur seal) before tracking south to Punakaiki for the pancake rocks.\n\nGreymouth the largest town of the West Coast straddles the Grey river and is a comfortable place to finish your day.\n\nIf you have the time and are interested in trains you can catch the train to Christchurch return, the full day rail trip known as the TransAlpine transverses some stunning scenery.", "kind": "drive"}, {"name": "Greymouth - Franz Josef", "distance": "180 kms", "duration": "2.5 hrs", "description": "A short drive day, but if you are running to minimum time frames, I suggest get travelling by 0900. Stop in either Hokitika or Ross (30-45 min from Greymouth) and learn about the beautiful rock Pounamu (greenstone/jade) that is found in the region.\n\nThen head south to Franz Josef. This will get you into the glacier town to explore the glacier that afternoon.\n\nMAKE SURE YOU READ THE SECTION ON THE GLACIERS that can be found in the Locations section before you venture onto them.", "kind": "drive"}, {"name": "Franz Josef - Wānaka", "distance": "290 kms", "duration": "4.25 hrs", "description": "Either have breakfast before you leave or aim for the Lake Mathieson cafe and grab a bite there. The cafe is at the start/end of a half out walk that will take you to a stunning vantage point of Mt Cook and Mt Tasman reflecting in the lake.\n\nTracking alongside the Southern Alps you will follow the twisty West Coast road back through the town of Fox Glacier onto Haast. There will be many photo opportunities along the way.\n\nAt Haast the road turns inland and heads up the towards the pass, as it does so follows the Haast river.\n\nOnce crossed the pass you will follow the Makaroa river through the ranges until you get to the neck of lake Wānaka. You’ll cross the Neck and then trace the shores of Lake Hāwea before passing by Hāwea town and onto Wānaka town.\n\nThe alpine town of Wānaka has been for many years the New Zealanders winter get away, but word has got out and many international tourists flock here as well. Two ski commercial ski fields as accessed from Wānaka.", "kind": "drive"}, {"name": "Wānaka - Queenstown", "distance": "80 kms", "duration": "1.5 hrs", "description": "Following the Cardrona Valley you will pass the Cardrona Ski field, opposite the valley from the ski field is where the race to the sky is held and were Possum Bourne tragically died competing in the hill climb event.\n\nCrossing the Crowne Range has you descending toward the Kawarau River. Take care on the section of the road known as the switchbacks, the road hugs the hill and winds back and forth on itself, busses will use the whole road to get around the corners.\n\nAt the bottom of the Crowne Range you can turn left and a quick 10 min up the road is the original A J Hackett Bungie bridge. Otherwise turning right will take you to Queenstown. You can follow the road to Arrowtown or stay on the main road that will take you to the resort town of Queenstown.", "kind": "drive"}, {"name": "Queenstown - Milford Sound", "distance": "287 Kms", "duration": "4.5 hrs", "description": "This is a big day of driving and including a boat cruise in Milford Sound is best left to the professional drivers.\n\nThis road is dangerous not only because of the terrain, but more because of distracted drivers and tired drivers.\n\nIf you wish to drive this yourself please read the Milford Sound Day trip section in “Locations”.\n\nThe day trip into Milford Sound is well worth the time and energy, it traverses stunning landscape that changes by the hour with weather and time of the day.", "kind": "daytrip"}, {"name": "Queenstown - Invercargill", "distance": "181 kms", "duration": "2.45 hrs", "description": "You will follow Lake Wakatipu south passing Kingston and within about 30 min the hill fade behind you. This lower part of Southland is flat and easy to drive through.\n\nYou should easily arrive into Invercargill the home of Burt Munro. Burt set a land speed record in 1967 on his 1920’s Indian Scout motorbike at the age of 67. Hi story is endearing and nicely portrayed by Sir Anthony Hopkins in the move “The Worlds Fastest Indian”. Burts actual bike is on display in the local hardware store (which is well worth a visit).\n\nThe southern most point of Mainland New Zealand is Bluff which is a short 15-30 min drive south of Invercargill, Bluff is not only know for its location but also the Bluff Oysters which can be bought at a number fo local fish. and chip shops.", "kind": "drive"}, {"name": "Invercargill - Dunedin (via Catlins coast)", "distance": "258 kms", "duration": "4 hrs", "description": "This deceptively short drive is not an easy one in sections. If you want to get to Dunedin in time for a wildlife tour the afternoon of your arrival then follow State Highway straight through to Dunedin.\n\nIf you want to see the south eastern coast, the Catlins coast road will take you through the Catlins Forest. You will follow open pastoral land before entering the Catlins Forest. The road will twist and wind with lots of walks starting from the road side.\n\nTo be controversial because I know this region is the pride of the south and it well advertised. My recommendation is only take this route if you plan to camp and do a walk or two. Otherwise this is a whistle stop trip along a twisty road.\n\nRegardless which road you choose, you will arrive at Balclutha that is famous for its bridge crossing the Clutha River.\n\nA climb up the Mosgiel hill indicates you are on ythe outskirts of Dunedin.\n\nDunedin is the a city with and proud of its Scottish heritage and is often nicknamed the Edinburgh of the south. Look for the poet Robbie Burns in the middle of the octagon.", "kind": "drive"}, {"name": "Dunedin - Tekapo", "distance": "310 kms", "duration": "4 hrs", "description": "This drive will really have you wondering where in the world you are. \n\nLeaving the Otago harbour and Dunedin behind you. After climbing out of the city you’ll cruise easily along the coast road north until you get to Moeraki. Moreraki is famous for its round boulders imbedded in the sand.\n\nA short run north and Omarau is a town built literally on Limestone that for years the building material was knowns as Oamaru Stone. Do have a look at the Victorian quarter and the Steampunk Museum.\n\nTurning westward leads you up the Waitaki Valley, a valley that has been dammed for hydroelectric generation. I suggest you cross the Aviemore Dam take a photo and then cross back again and same again from the Benmore dam. Especially during summer do not be tempted to use the road linking the two dams, the area is where a lot of people holiday and the roads can be dangerous with all the walkers.\n\nAt the top of the valley is the Mackenzie Country, you are now high up on the eastern side of the Southern Alps. It is a landscape that is completely unexpected, with the tussock laden soft terrain laced with turquoise canals and rivers, backdropped by the big mountains.\n\nAbout 30 minutes before Tekapo is Lake Pukakai on a clear day you will be able to see and pick out Aoraki/Mt Cook (its the big mountain) at the head of the lake. This is a photo opportunity that if weather permits is not worth missing.\n\nTekapo is at the foot of Lake Tekapo and the base of Mt John. There is an ice rink and hot pools to ease tired muscles from the driving that can be found at the western end of the Campground..", "kind": "drive"}, {"name": "Tekapo - Christchurch", "distance": "230 kms", "duration": "3.25 hrs", "description": "Dropping down out of the alpine landscape you will notice the decent to the town of Fairlie. Fairlie Bakery is nationally famous for its pies - great late Breakfast or morning tea spot.\n\nFrom there my route will take you to Waitohi where all that is there is a weird statue of an airplane. This is the spot where Richard Pearce achieved powered flight in a heavier than air machine in 1903.\n\nOnto Geraldine for a refresh stop, There is lots of tourist shops due to the busses that stop here, but what is of interest is in the i-site is the worlds largest woollen knitted jumper.\n\nThe landscape becomes very flat upon leaving Geraldine as you cross the Canterbury plains and onto Christchurch.\n\nIf you leave Tekapo early morning you will comfortably arrive into Christchurch with enough time to look around and maybe get in a sight or two.", "kind": "drive"}, {"name": "Christchurch - Kaikōura", "distance": "180 km", "duration": "2.5 hrs", "description": "If you are hoping to see Whales or Dolphins in your afternoon at Kaikōura, then I recommend let the rush hour traffic drop away and then get out of the city and head north.\n\nPretty easy driving for most of the day, only a ridgeline to cross just before meeting the coast about 15-30 min south of Kaikōura.\n\nKaikoura is famous for its marine life, great sea food delicacies to nature observation of whales and swimming with dolpins.", "kind": "drive"}, {"name": "Kaikōura - Picton", "distance": "160 km", "duration": "2.25 hrs", "description": "You will have noticed that Kaikōura is between the top of the Southern Alps and the South Pacific Ocean. The road will twist and wind its way along the coast before about half way along your journey it will head inland.\n\nYou will know you are close to Blenheim because when you come off the Wither hills you will see vineyard after vineyard lining the road sides.\n\nIf you can afford the time a night in Blenheim to either do a wine tour and or visit Omaka World War One aviation museum is well worth the effort.", "kind": "drive"}, {"name": "Picton - Wellingon", "distance": "Ferry", "duration": "3 hrs", "description": "There is two ferry providers moving people and vehicles across the Cook Straight. the ferries take about 3 hours to cross the straight.", "kind": "ferry"}, {"name": "Wellington - Napier", "distance": "329 kms", "duration": "4 hrs", "description": "Heading out of Wellington is the twisty road that traverses the Rimutaka range, this is not a road to take lightly, in winter can be closed due to ice, snow and wind (at the same time).\n\nOnce over the range you will be in the farming region of the Wairapara, the road essentially follows a river basin through to Mt Bruce. Mt Bruce is the location but as a tourist you will really only notice the wildlife centre. I recommend a stop, they have kiwi and for many years this was the only place you’d be likely to see the famous bird.\n\nAfter leaving Waipukurau you will increasingly see vineyards that you drive by, these vineyards will be interlaced with orchards of various types of fruit.\n\nHastings is the southern of the two cities that make up this area. Close up the road is Napier. Both of these cities, although Napier promotes itself as such, are home to a lot of Art Deco style architecture. An Art Deco tour is well worth it in the afternoon of your arrival into Napier.", "kind": "drive"}, {"name": "Napier - Gisborne", "distance": "251 kms", "duration": "3.25 hrs", "description": "The drive from Napier to Gisborne is one of easy smooth driving mixed with winding roads traversing ridges and ranges.\n\nYou are entering a part of New Zealand largely untouched by tourism. For years the region depended on sheep and beef production and forestry. You will see meat processing plants and remnants of, as well as Trucks ladened with sheep, cows or logs.\n\nCows that are raised for their meat in New Zealand are referred to as cattle or beef animals. So trucks you see with sheep or beef animals on are called Cattle Trucks. Watch as they go past you, see if you can see the drivers dog excitedly poking their head out from a box under the truck.\n\nGisborne is a city that feels remote (for New Zealand) three slow to drive roads lead to the city. Apart from an annual New Years Music Festival Gisborne is largely an economic centre for a rural community.\n\nThis is the New Zealand from the 1970 and 1980’s, this is not ment in a bad way, just don’t expect flashy tourist bars, hotels and attractions. You will find modest accommodation and respectful nods to its past.", "kind": "drive"}, {"name": "Gisborne - Rotorua", "distance": "458 kms", "duration": "7 hrs", "description": "This is a big day to do in one drive, unfortunately accommodation can be difficult to find if you are not brining your own accommodation. If you do some research before you go if you want to break this trip up, some camp grounds have cabins available.\n\nThis drive will give your arms a good work out, its a winding road for most of it. But The scenery is amazing and you will see and drive past Māori Marae, some have amazingly carved Wharetupuna. Please be respectful of these locations do not just walk into the grounds around them. There is protocol to follow to enter.\n\nDo not be surprised to find the locals to be riding horseback up the main street. DO NOT speed, rev your engine, toot your horn around horses.\n\nState Highway 35 winds it way through, around and past some stunningly remote beautiful landscapes. Just out or Ruatoria is  a mountain that is the first part of New Zealand to see the sun (and until the International Date Line moved, the world) every day.\n\nYou will feel a change in the landscape as you move from the wild East Cape to the Bay of Plenty, the calmer pristine beaches looking out at White Island. Taikia Wai-iti's film “Boy” was filmed on this coast.\n\nIt may be tempting to spend the night at Ōpōtiki or Whakatāne, and if you have the time, thats a great idea. But if you don’t have the flexibility, keep moving through to Rotorua.\n\nThis will mean the following day you can enjoy the geothermal delights and Māori Cultural shows without rushing.\n\nWhile I hae indicated 7 hrs driving as a reminder this is drive time so not including stops etc allow 9-10 for this day.", "kind": "drive"}, {"name": "Tongario Crossing", "distance": "Use bus transport", "duration": "10 hrs", "description": "The Tongariro Crossing is a one day alpine crossing that transverses Mt Tongariro. It is billed as one of the best most accessible alpine crossings in the world.\n\nLike all alpine activities it is very weather dependant as per its safety. You can drive yourself to the start.. but remember you will need to get from the end back to the start (its a one way trek).\n\nI recommend for safety, comfort and ease sake to use a transport operator out of Taupō or Tūrangi. They will take you to the start and pick you up at the end. Also inform you if it's unsafe", "kind": "activity"}, {"name": "Rotorua - Taupō", "distance": "80 km", "duration": "1 hr", "description": "Rotorua and Taupō are both part of New Zealand's geothermal zone. \n\nWai o tapu geothermal reserve is a short drive south of Rotorua. Time your trip to either start or finish seeing the Lady Knox geyser erupt at 10:15 daily. Allow an hour for the park.\n\nRock n Ropes adventure park is just north of Taupō and is a high adrenaline value for money activity (do book ahead).\n\nTaupo is nestled on the shores of the largest volcanic lake in the world. Before arriving in the town do stop to see the Huka Falls and the Volcanic centre on the northern outskirts of the town.", "kind": "drive"}, {"name": "Taupō - Coromandel Town", "distance": "256 kms", "duration": "3.45 hrs", "description": "Following State Highway north through forestry landscapes leads into rolling dairy farm lands. Aim to stop at Tirau and see the buildings like sheep and dog that house the i-site.\n\nNorth of Tirau track north east along the eastern side of the Hauraki plains. Make sure you stop at the little town of Paeroa, this little town has a cafe that is very keen for you to learn the origins of the drink you may have seen on your travels L&P (Lemon & Paeroa).\n\nGently wind your through to Thames before heading north on the slow, twisty, narrow, road taking you to Coromandel Town.\n\nCoromandel Town is laid back holiday town who's origins are steeped in gold mining. If you can plan it spend a day or two to explore the beaches of the peninsular and relax before head to Auckland and fly out.", "kind": "drive"}, {"name": "Coromandel Town - Auckland", "distance": "170 kms", "duration": "2.5 hrs", "description": "If you have done this part of the trip on minimum time, then follow the eastern coast road through Whitianga back to just south of Thames and head straight through to Auckland.\n\nThis part of the trip will have you cross the top of the Hauraki plains before crossing the Bombay hills into Auckland.", "kind": "drive"}]}];

  const attractionsBtnEl = document.getElementById('attractions-btn');
  const detailPanelEl = document.getElementById('location-detail-panel');

  function getRoute(id) {

  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    ROUTES.forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'route-tab' + (r.id === currentRoute ? ' active' : '');
      btn.textContent = r.name;
      btn.onclick = () => {
        currentRoute = r.id;
        currentLocationIndex = 0;
        currentJourneyIndex = 0;
        renderTabs();
        renderRoute();
      };
      tabsEl.appendChild(btn);
    });
  }

  function renderRoute() {
    const route = getRoute(currentRoute);
    bannerEl.src = route.images.banner;
    bannerEl.alt = route.name + ' route banner';
    carEl.src = route.images.car;
    carEl.alt = route.vehicle;
    daysEl.textContent = route.days;
    vehicleEl.textContent = route.vehicle;
    mapEl.src = route.images.map;
    mapEl.alt = route.name + ' route map';

    selectEl.innerHTML = '';
    route.locations.forEach((loc, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = loc.name;
      selectEl.appendChild(opt);
    });
    selectEl.value = currentLocationIndex;
    renderLocation();
    renderDrum();
  }

  function renderLocation() {
    const route = getRoute(currentRoute);
    const loc = route.locations[currentLocationIndex];
    nameEl.textContent = loc.name;
    descEl.textContent = loc.desc;
    closePanel(detailPanelEl, detailBtnEl, 'More about this location');
    closePanel(attractionsPanelEl, attractionsBtnEl, 'Attractions');
  }

  selectEl.addEventListener('change', () => {
    currentLocationIndex = parseInt(selectEl.value, 10);
    renderLocation();
  });

  // ---- Pull-in content: "More about this location" / "Attractions" ----
  // Fetches the relevant page once, caches the parsed document, then lifts
  // the matching fragment straight into this page instead of navigating away.
  const docCache = {};
  function fetchDoc(url) {
    if (docCache[url]) return docCache[url];
    docCache[url] = fetch(url)
      .then(res => res.text())
      .then(html => new DOMParser().parseFromString(html, 'text/html'));
    return docCache[url];
  }

  function sanitizeFragment(el) {
    el.querySelectorAll('[onclick]').forEach(node => node.removeAttribute('onclick'));
    el.querySelectorAll('script').forEach(node => node.remove());
    return el;
  }

  function closePanel(panelEl, btnEl, label) {
    panelEl.classList.remove('open');
    panelEl.innerHTML = '';
    btnEl.textContent = label;
    btnEl.dataset.open = '';
  }

  function openLoading(panelEl) {
    panelEl.innerHTML = '<div class="inline-loading"><span class="inline-loading-dot"></span><span class="inline-loading-dot"></span><span class="inline-loading-dot"></span><span>Pulling more info…</span></div>';
    panelEl.classList.add('open');
  }

  function setupPullButton(btnEl, panelEl, defaultLabel, loadingLabel, loadFragmentFn) {
    btnEl.addEventListener('click', () => {
      const isOpen = btnEl.dataset.open === 'true';
      if (isOpen) {
        closePanel(panelEl, btnEl, defaultLabel);
        return;
      }
      btnEl.dataset.open = 'true';
      btnEl.textContent = 'Hide';
      btnEl.classList.add('loading');
      openLoading(panelEl);

      const minDelay = new Promise(resolve => setTimeout(resolve, 450));
      Promise.all([loadFragmentFn(), minDelay])
        .then(([fragmentEl]) => {
          panelEl.innerHTML = '';
          const wrap = document.createElement('div');
          wrap.className = 'inline-detail-inner';
          if (fragmentEl) {
            wrap.appendChild(fragmentEl);
          } else {
            wrap.innerHTML = '<p class="body-text" style="margin:0;">Nothing found for this location yet.</p>';
          }
          panelEl.appendChild(wrap);
        })
        .catch(() => {
          panelEl.innerHTML = '<div class="inline-detail-inner"><p class="body-text" style="margin:0;">Could not load that right now.</p></div>';
        })
        .finally(() => {
          btnEl.classList.remove('loading');
        });
    });
  }

  setupPullButton(detailBtnEl, detailPanelEl, 'More about this location', 'Pulling…', () => {
    const route = getRoute(currentRoute);
    const loc = route.locations[currentLocationIndex];
    return fetchDoc('nz_locations.html').then(doc => {
      const panel = doc.getElementById('panel-' + loc.slug);
      if (!panel) return null;
      const clone = panel.cloneNode(true);
      clone.removeAttribute('id');
      clone.classList.remove('region-panel');
      // Drop the eyebrow/heading (name is already shown above) — but keep the
      // body-text description here now, since the location card above only
      // shows the short one-line tagline, not the full description.
      const eyebrow = clone.querySelector('.eyebrow');
      if (eyebrow) eyebrow.remove();
      const heading = clone.querySelector('.section-heading');
      if (heading) heading.remove();
      return sanitizeFragment(clone);
    });
  });

  setupPullButton(attractionsBtnEl, attractionsPanelEl, 'Attractions', 'Pulling…', () => {
    const route = getRoute(currentRoute);
    const loc = route.locations[currentLocationIndex];
    return fetchDoc('nz_attractions.html').then(doc => {
      const panel = doc.getElementById('panel-' + loc.slug);
      if (!panel) return null;
      const clone = panel.cloneNode(true);
      clone.removeAttribute('id');
      return sanitizeFragment(clone);
    });
  });

  // ---- Journeys drum ----
  function renderDrum() {
    const route = getRoute(currentRoute);
    drumTrack.innerHTML = '';
    route.journeys.forEach((j, i) => {
      const item = document.createElement('div');
      item.className = 'drum-item';
      item.dataset.index = i;
      item.innerHTML = '<p class="drum-item-name">' + j.name + '</p>';
      item.addEventListener('click', () => {
        scrollDrumTo(i);
      });
      drumTrack.appendChild(item);
    });
    currentJourneyIndex = 0;
    // wait for layout then snap to first item and render
    requestAnimationFrame(() => {
      scrollDrumTo(0, true);
    });
  }

  function scrollDrumTo(index, instant) {
    const items = drumTrack.querySelectorAll('.drum-item');
    if (!items.length) return;
    const item = items[index];
    if (!item) return;
    const targetTop = item.offsetTop - (drumTrack.clientHeight / 2) + (item.clientHeight / 2);
    drumTrack.scrollTo({ top: targetTop, behavior: instant ? 'auto' : 'smooth' });
  }

  let drumScrollTimeout = null;
  drumTrack.addEventListener('scroll', () => {
    if (drumScrollTimeout) clearTimeout(drumScrollTimeout);
    drumScrollTimeout = setTimeout(updateCenteredJourney, 80);
  });

  function updateCenteredJourney() {
    const items = Array.from(drumTrack.querySelectorAll('.drum-item'));
    if (!items.length) return;
    const trackMid = drumTrack.scrollTop + drumTrack.clientHeight / 2;
    let closest = 0;
    let closestDist = Infinity;
    items.forEach((item, i) => {
      const itemMid = item.offsetTop + item.clientHeight / 2;
      const dist = Math.abs(itemMid - trackMid);
      if (dist < closestDist) {
        closestDist = dist;
        closest = i;
      }
      item.classList.toggle('centered', dist < item.clientHeight / 2);
    });
    if (closest !== currentJourneyIndex) {
      currentJourneyIndex = closest;
    }
    renderJourneyDetail();
  }

  function renderJourneyDetail() {
    const route = getRoute(currentRoute);
    const j = route.journeys[currentJourneyIndex];
    if (!j) return;
    journeyKindEl.textContent = KIND_LABELS[j.kind];
    journeyNameEl.textContent = j.name;
    journeyDistEl.textContent = j.distance;
    journeyDurEl.textContent = j.duration;
    journeyDescEl.textContent = j.description;
    journeyProgressEl.textContent = 'Leg ' + (currentJourneyIndex + 1) + ' of ' + route.journeys.length + ' on the ' + route.name + ' route';
  }

  renderTabs();
  renderRoute();
</script>

</body>
</html>
