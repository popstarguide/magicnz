<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<style>
  * { box-sizing: border-box; }

  .eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #20b8b8;
    margin: 0 0 2px;
  }

  .section-heading {
    font-size: 22px;
    font-weight: 700;
    color: #20b8b8;
    line-height: 1.2;
    margin: 0 0 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #e8e8e8;
  }

  .sub-heading {
    font-size: 15px;
    font-weight: 700;
    color: #010707;
    margin: 24px 0 10px;
  }

  .body-text {
    font-size: 14px;
    color: #010707;
    margin: 0 0 12px;
    line-height: 1.8;
  }

  .route-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin: 0 0 16px;
    padding-bottom: 4px;
  }
  .route-tab {
    flex-shrink: 0;
    background: #e6f5f5;
    color: #0A3939;
    border: 1px solid #e6f5f5;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .route-tab.active {
    background: #20b8b8;
    border-color: #20b8b8;
    color: #fff;
  }

  .route-banner {
    width: 100%;
    border-radius: 10px;
    display: block;
    margin: 0 0 16px;
    object-fit: cover;
    max-height: 180px;
  }

  .vehicle-card {
    background: #010707;
    border-radius: 10px;
    padding: 16px 18px;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .vehicle-card img {
    width: 96px;
    height: 72px;
    object-fit: contain;
    background: #F7F3EF;
    border-radius: 8px;
    flex-shrink: 0;
    padding: 6px;
  }
  .vehicle-card-details { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .dark-card-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #20b8b8;
    margin: 0 0 4px;
  }
  .dark-card-text {
    font-size: 13px;
    color: #F7F3EF;
    line-height: 1.5;
    margin: 0;
  }

  .route-map-wrap {
    position: relative;
    width: 100%;
    max-width: 320px;
    margin: 0 auto 6px;
  }
  .route-map-wrap img {
    width: 100%;
    display: block;
    border-radius: 10px;
    border: 1px solid #e8e8e8;
  }
  .map-caption {
    font-size: 11px;
    color: #999;
    text-align: center;
    margin: 0 0 20px;
    font-style: italic;
  }

  /* ---- Location dropdown ---- */
  select.location-dropdown {
    width: 100%;
    font-size: 15px;
    font-weight: 600;
    color: #010707;
    background: #F7F3EF url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%23F25E0D" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 14px center;
    background-size: 14px;
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    padding: 14px 40px 14px 16px;
    margin: 0 0 16px;
    appearance: none;
    -webkit-appearance: none;
  }

  .location-card {
    background: #e6f5f5;
    border-left: 4px solid #20b8b8;
    border-radius: 0 8px 8px 0;
    padding: 14px 16px;
    margin: 0 0 12px;
  }
  .location-card-name {
    font-size: 16px;
    font-weight: 700;
    color: #0A3939;
    margin: 0 0 6px;
  }
  .location-card-desc {
    font-size: 14px;
    color: #010707;
    line-height: 1.7;
    margin: 0;
  }

  .link-row {
    display: flex;
    gap: 8px;
    margin: 0 0 24px;
  }
  .link-btn {
    flex: 1;
    display: block;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 10px;
    padding: 12px 10px;
  }
  .link-btn.primary {
    background: #20b8b8;
    color: #fff;
  }
  .link-btn.secondary {
    background: #010707;
    color: #F7F3EF;
  }
  .link-btn.loading {
    opacity: 0.6;
  }

  /* ---- Pulled-in content (location detail / attractions) ---- */
  .inline-detail {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.35s ease, opacity 0.3s ease;
    margin: 0;
  }
  .inline-detail.open {
    max-height: 4000px;
    opacity: 1;
    margin: 0 0 20px;
  }
  .inline-detail-inner {
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    padding: 16px;
  }
  .inline-loading {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #999;
    padding: 4px 2px;
  }
  .inline-loading-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #20b8b8;
    animation: pulse-dot 1s ease-in-out infinite;
  }
  .inline-loading-dot:nth-child(2) { animation-delay: 0.15s; }
  .inline-loading-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse-dot {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }
  .inline-detail .pretty-pic {
    width: 100%;
    border-radius: 10px;
    display: block;
    margin: 0 0 16px;
    object-fit: cover;
    max-height: 220px;
  }
  .inline-detail .thumb-row {
    display: flex;
    gap: 8px;
    margin: -8px 0 16px;
    overflow-x: auto;
  }
  .inline-detail .thumb-pic {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .inline-detail .dark-card {
    background: #010707;
    border-radius: 10px;
    padding: 16px 18px;
    margin: 0;
  }
  .inline-detail .activity-card {
    padding: 16px 0;
    border-bottom: 1px solid #e8e8e8;
  }
  .inline-detail .activity-card:last-child { border-bottom: none; }
  .inline-detail .activity-card-row {
    display: flex;
    gap: 12px;
    margin: 0 0 10px;
  }
  .inline-detail .activity-icon {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .inline-detail .activity-card-body { flex: 1; min-width: 0; }
  .inline-detail .activity-photo {
    width: 100%;
    max-height: 200px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
    margin: 0 0 6px;
  }
  .inline-detail .activity-thumb-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
  }
  .inline-detail .activity-thumb {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .inline-detail .activity-card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 4px;
  }
  .inline-detail .activity-card-name {
    font-size: 15px;
    font-weight: 700;
    color: #010707;
    margin: 0;
  }
  .inline-detail .activity-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .inline-detail .activity-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .inline-detail .activity-badge.top5 {
    background: #0A3939;
    color: #fff;
  }
  .inline-detail .activity-badge.fee {
    background: #F7F3EF;
    color: #757575;
    border: 1px solid #e8e8e8;
  }
  .inline-detail .activity-card-desc {
    font-size: 13px;
    color: #757575;
    line-height: 1.7;
    margin: 0;
  }

  /* ---- Journeys drum ---- */
  .drum-wrap {
    position: relative;
    margin: 0 0 8px;
  }
  .drum-track {
    height: 264px;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 108px 0;
    scrollbar-width: none;
  }
  .drum-track::-webkit-scrollbar { display: none; }
  .drum-item {
    scroll-snap-align: center;
    padding: 6px 8px;
    text-align: center;
    opacity: 0.35;
    transform: scale(0.88);
    transition: opacity 0.15s ease, transform 0.15s ease;
    cursor: pointer;
  }
  .drum-item.centered {
    opacity: 1;
    transform: scale(1);
  }
  .drum-item-kind {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #20b8b8;
    margin: 0 0 2px;
  }
  .drum-item-name {
    font-size: 15px;
    font-weight: 700;
    color: #010707;
    margin: 0 0 2px;
  }
  .drum-item-meta {
    font-size: 11px;
    color: #999;
  }
  .drum-frame-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: #e8e8e8;
    pointer-events: none;
  }
  .drum-frame-line.top { top: 108px; }
  .drum-frame-line.bottom { bottom: 108px; }
  .drum-fade {
    position: absolute;
    left: 0; right: 0;
    height: 100px;
    pointer-events: none;
    z-index: 2;
  }
  .drum-fade.top {
    top: 0;
    background: linear-gradient(#ffffff, rgba(255,255,255,0));
  }
  .drum-fade.bottom {
    bottom: 0;
    background: linear-gradient(rgba(255,255,255,0), #ffffff);
  }

  .journey-detail {
    background: #010707;
    border-radius: 10px;
    padding: 16px 18px;
    margin: 0 0 20px;
  }
  .journey-detail-dist {
    display: flex;
    gap: 20px;
    margin: 0 0 10px;
  }
  .journey-detail-desc {
    font-size: 13px;
    color: #F7F3EF;
    line-height: 1.7;
    margin: 0;
    white-space: pre-line;
  }
  .journey-progress {
    font-size: 12px;
    color: #999;
    text-align: center;
    margin: 0 0 20px;
  }
</style>
</head>
<body style="background:#ffffff;color:#010707;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:300;line-height:1.75;padding:16px 18px 60px;margin:0;">

<p class="eyebrow">Magic New Zealand</p>

<div class="route-tabs" id="route-tabs"></div>

<img class="route-banner" id="route-banner" src="" alt="">

<div class="vehicle-card">
  <img id="route-car" src="" alt="">
  <div class="vehicle-card-details">
    <div>
      <p class="dark-card-label">Days to complete</p>
      <p class="dark-card-text" id="route-days"></p>
    </div>
    <div>
      <p class="dark-card-label">Vehicle</p>
      <p class="dark-card-text" id="route-vehicle"></p>
    </div>
  </div>
</div>

<div class="route-map-wrap">
  <img id="route-map" src="" alt="Route map">
</div>
<p class="map-caption">A rough guide only — not a detailed driving map</p>

</div>

<div class="journey-detail">
  <p class="dark-card-label" id="journey-kind-label"></p>
  <p class="location-card-name" style="color:#20b8b8;" id="journey-name"></p>
  <div class="journey-detail-dist">
    <div>
      <p class="dark-card-label">Distance</p>
      <p class="dark-card-text" id="journey-distance"></p>
    </div>
    <div>
      <p class="dark-card-label">Duration</p>
      <p class="dark-card-text" id="journey-duration"></p>
    </div>
  </div>
  <p class="journey-detail-desc" id="journey-desc"></p>
</div>
<p class="journey-progress" id="journey-progress"></p>

<select class="location-dropdown" id="location-select"></select>

<div class="location-card">
  <p class="location-card-name" id="location-name"></p>
  <p class="location-card-desc" id="location-desc"></p>
</div>

<div class="link-row">
  <button type="button" class="link-btn primary" id="location-detail-btn">More about this location</button>
  <button type="button" class="link-btn secondary" id="attractions-btn">Attractions</button>
</div>

<div class="inline-detail" id="location-detail-panel"></div>
<div class="inline-detail" id="attractions-panel"></div>

<script>
  const ROUTES = [{"id": "Burt", "name": "Burt", "days": "Minimum 14 days", "vehicle": "Munro Special - Highly modified 1920 Indian Scout", "images": {"banner": "route_banners/burt_banner.jpg", "map": "route_maps/burt_map.png", "car": "route_cars/burt_car.jpg"}, "locations": [{"name": "Auckland", "slug": "auckland", "desc": "New Zealand's largest city, built around two harbours — for many, the gateway to the country."}, {"name": "Bay of Islands (Paihia)", "slug": "paihia_bay_of_islands", "desc": "Main hub for exploring the Bay of Islands — sailing, kayaking, and jet boating included."}, {"name": "Cape Reinga", "slug": "cape_reinga", "desc": "Where the Tasman and Pacific meet, the spiritual departure point for Māori spirits."}, {"name": "Rotorua", "slug": "rotorua", "desc": "The country's geothermal heartland, and the easiest place to experience Māori culture."}, {"name": "Taupō", "slug": "taup", "desc": "Sits on Lake Taupō, with trout fishing, skydiving, and geothermal pools minus Rotorua's smell."}, {"name": "Wellington", "slug": "wellington", "desc": "New Zealand's capital, and worth a full day on its own for Te Papa and Weta Workshop."}, {"name": "Picton", "slug": "picton", "desc": "South Island terminal for the Interislander ferry, and gateway to the Marlborough Sounds."}, {"name": "Nelson", "slug": "nelson", "desc": "New Zealand's sunniest city, and gateway to Abel Tasman National Park."}, {"name": "Greymouth", "slug": "greymouth", "desc": "Largest town on the West Coast, and western terminus of the TranzAlpine train journey."}, {"name": "Franz Josef", "slug": "franz_josef_glacier", "desc": "One of the most accessible glaciers in the world."}, {"name": "Queenstown", "slug": "queenstown", "desc": "New Zealand's adventure tourism hub, on the shores of Lake Wakatipu."}, {"name": "Dunedin", "slug": "dunedin", "desc": "A Scottish-built university city, with wildlife tours nearby a real highlight."}, {"name": "Lake Tekapo", "slug": "lake_tekapo", "desc": "A stunning lakeside town and one of the best stargazing spots in the world."}, {"name": "Christchurch", "slug": "christchurch", "desc": "Planned as an English city on the Canterbury Plains, rebuilding after the 2011 earthquake."}], "journeys": [{"name": "Auckland - Pahia (via Opononi)", "distance": "363 km", "duration": "5.5 hrs", "description": "Depart Auckland, home to approximately a third of New Zealand's population and is the countries largest city. Auckland is amongst the largest cities geographically per population and is the largest Polynesian city in the world. On a global population scale is relatively small with around 3.5 million people.\n\nIf you start your journey to sit on the tail of the morning rush hour you should arrive in Matakohe for morning tea. with enough time to see the Kauri museum.\n\nAim to get to Waipoua Forest and see Tāne Mahuta  before a quick bite for a late lunch at Opononi. tane Mahuta is the largest tree per volume in the Southern Hemisphere. Do take the time to explore the Opononi I-Site and learn about its once famous dolphin - Opo.\n\nThis should have you arriving into the stunning Paihia late afternoon. Nestled in the heart of the Bay of Islands Paihia sits on the shores of stunning white calm beaches with many activities to explore the region on offer.", "kind": "drive"}, {"name": "Pahia - Cape Reinga - Pahia", "distance": "395 km", "duration": "5.5 hrs", "description": "Follow State Highway 1 north to Kaitaia, Overall this is a comfortable drive with the Manganoka range providing a bit of slow driving just south of Kaitaia.\n\nKaitaia the northern most township in the region, is a good place to ensure you have a full tank or charge in your vehicle before heading north.\n\nA lot of Northlands early infrastructure was built on the Kauri industry, you will find a few accessible Kauri shops on your drive out of town.\n\nCape Reinga is the northernmost point of New Zealand and the Māori believe that when they die their spirit will depart to Hawaiki their spiritual homeland from this point. A picturesque lighthouse is near to the departure point.\n\nReturn back to Paihia via the Eastern coast road, Mangaoui is famous for its fish and chips, many tour busses will stop so expect the town to be busy.", "kind": "daytrip"}, {"name": "Paihia - Auckland", "distance": "227 km", "duration": "3.25 hrs", "description": "A reasonably easy drive south will take you through Whangarei, the financial centre for Northland.\n\nYou should arrive in Auckland with plenty of time to take in a visit to MOTAT, or Kelly Tarlton’s, or maybe do the Skytower jump.", "kind": "drive"}, {"name": "Auckland - Rotorua via Waitomo", "distance": "330 km", "duration": "4.5 hrs", "description": "Leaving Auckland head south into the Waikato region. I would aim to get to Waitomo for about 10am through to midday. Yes you will be tracking with the tour buses but it will give you time to arrive and get on a tour through the limestone caves the area is famous for.\n\nThere is many ways to see the caves, the classic caves tour at the main entrance (easily sign posted, just past the village), or maybe you might want to do black water rafting (ride the underground streams in a personal raft), or abseil down into the caves and experience a bit of spelunking your way back out.\n\nA comfortable drive of a couple hours through to Rotorua. Rotorua is well known for its geothermal activity and Māori cultural shows.", "kind": "drive"}, {"name": "Rotorua - Taupō", "distance": "80 km", "duration": "1 hr", "description": "Rotorua and Taupō are both part of New Zealand's geothermal zone. \n\nWai o tapu geothermal reserve is a short drive south of Rotorua. Time your trip to either start or finish seeing the Lady Knox geyser erupt at 10:15 daily. Allow an hour for the park.\n\nRock n Ropes adventure park is just north of Taupō and is a high adrenaline value for money activity (do book ahead).\n\nTaupo is nestled on the shores of the largest volcanic lake in the world. Before arriving in the town do stop to see the Huka Falls and the Volcanic centre on the northern outskirts of the town.", "kind": "drive"}, {"name": "Taupō - Wellington", "distance": "380 km", "duration": "5 hrs", "description": "A solid day of driving. I suggest get away at a comfortable early time, you will be treated to picturesque scenes as you drive round the lake then through the Central Plateau.\n\nThe Waiouru Army Museum is a great morning tea stop and a well presented history of our army.\n\nDropping down through a smaller scale version of the Scottish Highlands and into the Manawatu plains will take you through the grass hills with sheep happily grazing into the flats of the plains where dairy cows will be ruminating.\n\nYou should arrive into Wellington mid to late afternoon. Wellington geographically is an interesting city with three fault lines running through the city it is also the capital city of New Zealand.", "kind": "drive"}, {"name": "Wellington - Picton", "distance": "Ferry", "duration": "3 hrs", "description": "There is two ferry providers moving people and vehicles across the Cook Straight. the ferries take about 3 hours to cross the straight.", "kind": "ferry"}, {"name": "Picton - Nelson", "distance": "140 kms", "duration": "2.5 hrs", "description": "You will quickly notice a change in the landscape from the North Island. Arriving in Picton that is deep in the Marlborough Sounds, quickly popping out into the Marlborough flats wine region.\n\nOnce you get past Havelock (the self proclaimed green lipped mussel capital of New Zealand) you will need to cross the northern part of the Southern Alps with a series of climbs and descents that twist and wind their way up and through valleys, until you get to the sheltered city of Nelson.\n\nNelson is the geographical centre of New Zealand and the gateway to the Abel Tasman National Park. The national park offers accessible walks that vary from a day walk to several days.", "kind": "drive"}, {"name": "Nelson - Greymouth (via Westport)", "distance": "300 kms", "duration": "4.5 hrs", "description": "While ‘only 4.5hrs’ driving I would get underway after an early breakfast, follow the valleys out of town.\n\nA quick photo stop at the top of the Hope Saddle then follow the Buller river to Westport. Do look out for a spot called Hawkes Craig, the scenic and interesting spot is a particularly narrow bit of road.\n\nIf you arrive at Westport late morning, you could fit in a trip to to Denniston and old abandoned coal mine (allow a couple of hours).\n\nHead to Cape Foul wind where you can see the Kekerengu (NZ Fur seal) before tracking south to Punakaiki for the pancake rocks.\n\nGreymouth the largest town of the West Coast straddles the Grey river and is a comfortable place to finish your day.\n\nIf you have the time and are interested in trains you can catch the train to Christchurch return, the full day rail trip known as the TransAlpine transverses some stunning scenery.", "kind": "drive"}, {"name": "Greymouth - Franz Josef", "distance": "180 kms", "duration": "2.5 hrs", "description": "A short drive day, but if you are running to minimum time frames, I suggest get travelling by 0900. Stop in either Hokitika or Ross (30-45 min from Greymouth) and learn about the beautiful rock Pounamu (greenstone/jade) that is found in the region.\n\nThen head south to Franz Josef. This will get you into the glacier town to explore the glacier that afternoon.\n\nMAKE SURE YOU READ THE SECTION ON THE GLACIERS that can be found in the Locations section before you venture onto them.", "kind": "drive"}, {"name": "Franz Josef - Queenstown", "distance": "353 kms", "duration": "5.25 hrs", "description": "Either have breakfast before you leave or aim for the Lake Mathieson cafe and grab a bite there, either way aim for an early start. This drive as you may be able to tell from 350 km taking 5.25 hrs is not a fast drive. If you want to stop take photos and enjoy the drive, its best to keep steadily moving, otherwsie you can fins yourself rushing at the other end. Be aware of road conditions in winter.\n\nThe cafe is at the start/end of a half out walk that will take you to a stunning vantage point of Mt Cook and Mt Tasman reflecting in the lake.\n\nTracking alongside the Southern Alps you will follow the twisty West Coast road back through the town of Fox Glacier onto Haast. There will be many photo opportunities along the way.\n\nAt Haast the road turns inland and heads up the towards the pass, as it does so follows the Haast river.\n\nOnce crossed the pass you will follow the Makaroa river through the ranges until you get to the neck of lake Wānaka. You’ll cross the Neck and then trace the shores of Lake Hāwea before passing by Hāwea town and onto Wānaka town.\n\nThe alpine town of Wānaka has been for many years the New Zealanders winter get away, but word has got out and many international tourists flock here as well. Two ski commercial ski fields as accessed from Wānaka.Following the Cardrona Valley you will pass the Cardrona Ski field, opposite the valley from the ski field is where the race to the sky is held and were Possum Bourne tragically died competing in the hill climb event.\n\nCrossing the Crowne Range has you descending toward the Kawarau River. Take care on the section of the road known as the switchbacks, the road hugs the hill and winds back and forth on itself, busses will use the whole road to get around the corners.\n\nAt the bottom of the Crowne Range you can turn left and a quick 10 min up the road is the original A J Hackett Bungie bridge. Otherwise turning right will take you to Queenstown. You can follow the road to Arrowtown or stay on the main road that will take you to the resort town of Queenstown.", "kind": "drive"}, {"name": "Queenstown - Dunedin", "distance": "282 kms", "duration": "4 hrs", "description": "Follow the Kawareau River East to Cromwell at the large fibreglass fruit turn right and from there follow the valley east.\n\nYou will cross a man made hydro electric lake and travel through the historic Otago gold fields.\n\narriving in Dunedin before lunch will allow time to get on a tour to the Albatross Centre. You can drive yourself to the centre, but as I have said in my “Recommendations\" section the Elm Wildlife tour is well worth every cent.", "kind": "drive"}, {"name": "Dunedin - Tekapo", "distance": "310 kms", "duration": "4 hrs", "description": "This drive will really have you wondering where in the world you are. \n\nLeaving the Otago harbour and Dunedin behind you. After climbing out of the city you’ll cruise easily along the coast road north until you get to Moeraki. Moreraki is famous for its round boulders imbedded in the sand.\n\nA short run north and Omarau is a town built literally on Limestone that for years the building material was knowns as Oamaru Stone. Do have a look at the Victorian quarter and the Steampunk Museum.\n\nTurning westward leads you up the Waitaki Valley, a valley that has been dammed for hydroelectric generation. I suggest you cross the Aviemore Dam take a photo and then cross back again and same again from the Benmore dam. Especially during summer do not be tempted to use the road linking the two dams, the area is where a lot of people holiday and the roads can be dangerous with all the walkers.\n\nAt the top of the valley is the Mackenzie Country, you are now high up on the eastern side of the Southern Alps. It is a landscape that is completely unexpected, with the tussock laden soft terrain laced with turquoise canals and rivers, backdropped by the big mountains.\n\nAbout 30 minutes before Tekapo is Lake Pukakai on a clear day you will be able to see and pick out Aoraki/Mt Cook (its the big mountain) at the head of the lake. This is a photo opportunity that if weather permits is not worth missing.\n\nTekapo is at the foot of Lake Tekapo and the base of Mt John. There is an ice rink and hot pools to ease tired muscles from the driving that can be found at the western end of the Campground..", "kind": "drive"}, {"name": "Tekapo - Christchurch", "distance": "230 kms", "duration": "3.25 hrs", "description": "Dropping down out of the alpine landscape you will notice the decent to the town of Fairlie. Fairlie Bakery is nationally famous for its pies - great late Breakfast or morning tea spot.\n\nFrom there my route will take you to Waitohi where all that is there is a weird statue of an airplane. This is the spot where Richard Pearce achieved powered flight in a heavier than air machine in 1903.\n\nOnto Geraldine for a refresh stop, There is lots of tourist shops due to the busses that stop here, but what is of interest is in the i-site is the worlds largest woollen knitted jumper.\n\nThe landscape becomes very flat upon leaving Geraldine as you cross the Canterbury plains and onto Christchurch.\n\nIf you leave Tekapo early morning you will comfortably arrive into Christchurch with enough time to look around and maybe get in a sight or two.", "kind": "drive"}]}, {"id": "Scott", "name": "Scott", "days": "Minimum 20 days", "vehicle": "Dixon’s 2023 Indy Car", "images": {"banner": "route_banners/scott_banner.jpg", "map": "route_maps/scott_map.png", "car": "route_cars/scott_car.jpg"}, "locations": [{"name": "Auckland", "slug": "auckland", "desc": "New Zealand's largest city, built around two harbours — for many, the gateway to the country."}, {"name": "Bay of Islands (Paihia)", "slug": "paihia_bay_of_islands", "desc": "Main hub for exploring the Bay of Islands — sailing, kayaking, and jet boating included."}, {"name": "Cape Reinga", "slug": "cape_reinga", "desc": "Where the Tasman and Pacific meet, the spiritual departure point for Māori spirits."}, {"name": "New Plymouth", "slug": "new_plymouth", "desc": "A city that punches above its weight for festivals, art, and genuinely world-class surf."}, {"name": "Wellington", "slug": "wellington", "desc": "New Zealand's capital, and worth a full day on its own for Te Papa and Weta Workshop."}, {"name": "Picton", "slug": "picton", "desc": "South Island terminal for the Interislander ferry, and gateway to the Marlborough Sounds."}, {"name": "Nelson", "slug": "nelson", "desc": "New Zealand's sunniest city, and gateway to Abel Tasman National Park."}, {"name": "Greymouth", "slug": "greymouth", "desc": "Largest town on the West Coast, and western terminus of the TranzAlpine train journey."}, {"name": "Franz Josef", "slug": "franz_josef_glacier", "desc": "One of the most accessible glaciers in the world."}, {"name": "Wānaka", "slug": "wanaka", "desc": "A quieter alternative to Queenstown, with lake activities and ski fields nearby."}, {"name": "Queenstown", "slug": "queenstown", "desc": "New Zealand's adventure tourism hub, on the shores of Lake Wakatipu."}, {"name": "Milford Sound", "slug": "milford_sound_self_drive_day_trip", "desc": "Home to Mitre Peak, one of the most photographed landmarks in the country."}, {"name": "Invercargill", "slug": "invercargill", "desc": "New Zealand's southernmost city, and home town of Burt Munro of the Worlds Fastest Indian fame."}, {"name": "Dunedin", "slug": "dunedin", "desc": "A Scottish-built university city, with wildlife tours nearby a real highlight."}, {"name": "Lake Tekapo", "slug": "lake_tekapo", "desc": "A stunning lakeside town and one of the best stargazing spots in the world."}, {"name": "Christchurch", "slug": "christchurch", "desc": "Planned as an English city on the Canterbury Plains, rebuilding after the 2011 earthquake."}, {"name": "Kaikōura", "slug": "kaikoura", "desc": "The place to see whales and dolphins up close, right off the coast."}, {"name": "Napier", "slug": "napier", "desc": "Rebuilt in Art Deco after the 1931 quake, now the densest collection of Art Deco architecture anywhere."}, {"name": "Taupō", "slug": "taup", "desc": "Sits on Lake Taupō, with trout fishing, skydiving, and geothermal pools minus Rotorua's smell."}, {"name": "Rotorua", "slug": "rotorua", "desc": "The country's geothermal heartland, and the easiest place to experience Māori culture."}], "journeys": [{"name": "Auckland - Pahia (via Opononi)", "distance": "363 km", "duration": "5.5 hrs", "description": "Depart Auckland, home to approximately a third of New Zealand's population and is the countries largest city. Auckland is amongst the largest cities geographically per population and is the largest Polynesian city in the world. On a global population scale is relatively small with around 3.5 million people.\n\nIf you start your journey to sit on the tail of the morning rush hour you should arrive in Matakohe for morning tea. with enough time to see the Kauri museum.\n\nAim to get to Waipoua Forest and see Tāne Mahuta  before a quick bite for a late lunch at Opononi. tane Mahuta is the largest tree per volume in the Southern Hemisphere. Do take the time to explore the Opononi I-Site and learn about its once famous dolphin - Opo.\n\nThis should have you arriving into the stunning Paihia late afternoon. Nestled in the heart of the Bay of Islands Paihia sits on the shores of stunning white calm beaches with many activities to explore the region on offer.", "kind": "drive"}, {"name": "Pahia - Cape Reinga - Pahia", "distance": "395 km", "duration": "5.5 hrs", "description": "Follow State Highway 1 north to Kaitaia, Overall this is a comfortable drive with the Manganoka range providing a bit of slow driving just south of Kaitaia.\n\nKaitaia the northern most township in the region, is a good place to ensure you have a full tank or charge in your vehicle before heading north.\n\nA lot of Northlands early infrastructure was built on the Kauri industry, you will find a few accessible Kauri shops on your drive out of town.\n\nCape Reinga is the northernmost point of New Zealand and the Māori believe that when they die their spirit will depart to Hawaiki their spiritual homeland from this point. A picturesque lighthouse is near to the departure point.\n\nReturn back to Paihia via the Eastern coast road, Mangaoui is famous for its fish and chips, many tour busses will stop so expect the town to be busy.", "kind": "daytrip"}, {"name": "Paihia - Auckland", "distance": "227 km", "duration": "3.25 hrs", "description": "A reasonably easy drive south will take you through Whangarei, the financial centre for Northland.\n\nYou should arrive in Auckland with plenty of time to take in a visit to MOTAT, or Kelly Tarlton’s, or maybe do the Skytower jump.", "kind": "drive"}, {"name": "Auckland - New Plymouth", "distance": "358 kms", "duration": "4.5 hrs", "description": "Allow the chaos of morning rush hour traffic to calm down then head south to Waitomo Caves.\n\nExplore the Waitomo Caves, which is clearly signposted just past the small village. Fo those with time and are adventurous spending the night here could allow you to experience the caves differently from the mainstream. Black water rafting which is riding the underground streams in a personal raft is a popular option or abseiling into the caves and doing a bit of spelunking you way back out of the caves is a highlight you wont forget.\n\nContinue your journey south will take you through the King Country into the Awakino George, a road that follows the river to the sea. On clear days you will break out of the inland part of the drive and be treated to stunning views of Mt Taranaki across the North Taranaki bight.\n\nFollow the coast south and arrive into New Plymouth. New Plymouth and the Taranaki region have been famous in New Zealand for Dairy products and oil & gas. The relaxed town is settled seaside and is home to some accessible surf.", "kind": "drive"}, {"name": "New Plymouth - Wellington", "distance": "382 kms", "duration": "5 hrs", "description": "Depending on time you have the choice which way to see Taranaki either around Surf Highway 45 or the “main road” State Highway 3.\n\nSurf Highway will take you round Mt Taranaki and despite ist name you’re not likely to see much surf, but you will see some interesting geography thats been created by the mountain.\n\nState Highway 3 will take you through the more populated route and the shakespearian town of Stratford.\n\nBoth routes will meet at Hawera and you will have reasonably comfortable drive south.\n\nWhanganui is a town built around the river which you will have to cross to head south.\n\nUnless you need to go to Palmerston North you probably will head straight to Wellington.\n\nWellington a city often overlooked is well worth a day to visit Te Papa the national museum, or explore the rug- ged hills that the city is built on. It is also the capital city of New Zealand.", "kind": "drive"}, {"name": "Wellington - Picton", "distance": "Ferry", "duration": "3 hrs", "description": "There is two ferry providers moving people and vehicles across the Cook Straight. the ferries take about 3 hours to cross the straight.", "kind": "ferry"}, {"name": "Picton - Nelson", "distance": "140 kms", "duration": "2.5 hrs", "description": "You will quickly notice a change in the landscape from the North Island. Arriving in Picton that is deep in the Marlborough Sounds, quickly popping out into the Marlborough flats wine region.\n\nOnce you get past Havelock (the self proclaimed green lipped mussel capital of New Zealand) you will need to cross the northern part of the Southern Alps with a series of climbs and descents that twist and wind their way up and through valleys, until you get to the sheltered city of Nelson.\n\nNelson is the geographical centre of New Zealand and the gateway to the Abel Tasman National Park. The national park offers accessible walks that vary from a day walk to several days.", "kind": "drive"}, {"name": "Nelson - Greymouth (via Westport)", "distance": "300 kms", "duration": "4.5 hrs", "description": "While ‘only 4.5hrs’ driving I would get underway after an early breakfast, follow the valleys out of town.\n\nA quick photo stop at the top of the Hope Saddle then follow the Buller
