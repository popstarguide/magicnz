<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Through Time</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #ffffff;
    color: #010707;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 300;
    line-height: 1.75;
    padding: 16px 18px 60px;
    margin: 0;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #20b8b8;
    margin: 0 0 4px;
  }
  .section-heading {
    font-size: 22px;
    font-weight: 700;
    color: #010707;
    margin: 0 0 16px;
  }

  /* ---- Search ---- */
  .search-input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    color: #010707;
    margin: 0 0 8px;
    -webkit-appearance: none;
    font-family: inherit;
  }
  .search-input:focus { outline: none; border-color: #20b8b8; }
  .search-status {
    font-size: 12px;
    color: #999;
    margin: 0 0 4px;
    min-height: 16px;
  }
  .search-clear {
    display: none;
    font-size: 12px;
    font-weight: 600;
    color: #20b8b8;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .search-clear.active { display: inline; }

  /* ---- Timeline drum (same mechanics as nz_routes.html journeys drum) ---- */
  .drum-wrap {
    position: relative;
    margin: 0 0 16px;
  }
  .drum-track {
    height: 160px;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 60px 0;
    scrollbar-width: none;
  }
  .drum-track::-webkit-scrollbar { display: none; }
  .drum-item {
    scroll-snap-align: center;
    padding: 6px 8px;
    text-align: center;
    opacity: 0.35;
    transform: scale(0.88);
    transition: opacity 0.15s ease, transform 0.15s ease;
    cursor: pointer;
  }
  .drum-item.centered {
    opacity: 1;
    transform: scale(1);
  }
  .drum-item-kind {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #20b8b8;
    margin: 0 0 2px;
  }
  .drum-item-name {
    font-size: 15px;
    font-weight: 700;
    color: #010707;
    margin: 0 0 2px;
  }
  .drum-item-meta {
    font-size: 11px;
    color: #999;
  }
  .drum-frame-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: #e8e8e8;
    pointer-events: none;
  }
  .drum-frame-line.top { top: 60px; }
  .drum-frame-line.bottom { bottom: 60px; }
  .drum-fade {
    position: absolute;
    left: 0; right: 0;
    height: 50px;
    pointer-events: none;
    z-index: 2;
  }
  .drum-fade.top {
    top: 0;
    background: linear-gradient(#ffffff, rgba(255,255,255,0));
  }
  .drum-fade.bottom {
    bottom: 0;
    background: linear-gradient(rgba(255,255,255,0), #ffffff);
  }
  .drum-empty {
    text-align: center;
    color: #999;
    font-size: 14px;
    padding: 100px 20px;
  }

  /* ---- Detail card (updates live as the drum scrolls) ---- */
  .timeline-detail {
    background: #010707;
    color: #fff;
    border-radius: 12px;
    padding: 20px;
  }
  .timeline-detail-era {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #20b8b8;
    margin: 0 0 6px;
  }
  .timeline-detail-date {
    font-size: 12px;
    color: #b8afa8;
    margin: 0 0 4px;
  }
  .timeline-detail-name {
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    margin: 0 0 12px;
  }
  .timeline-detail-image {
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    background: #010707;
    border-radius: 8px;
    display: block;
    margin: 0 0 14px;
  }
  .timeline-detail-desc {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.65;
    color: #e6e1db;
    white-space: pre-line;
    margin: 0;
  }
</style>
</head>
<body>

<p class="eyebrow">New Zealand history</p>
<h2 class="section-heading">Journey Through Time</h2>

<input type="text" class="search-input" id="timeline-search" placeholder="Search for a word in history" autocomplete="off">
<p class="search-status" id="search-status">&nbsp;</p>

<div class="drum-wrap">
  <div class="drum-fade top"></div>
  <div class="drum-frame-line top"></div>
  <div class="drum-track" id="drum-track"></div>
  <div class="drum-frame-line bottom"></div>
  <div class="drum-fade bottom"></div>
</div>

<div class="timeline-detail" id="timeline-detail">
  <p class="timeline-detail-era" id="detail-era"></p>
  <p class="timeline-detail-date" id="detail-date"></p>
  <p class="timeline-detail-name" id="detail-name"></p>
  <img class="timeline-detail-image" id="detail-image" src="" alt="" style="display:none;">
  <p class="timeline-detail-desc" id="detail-desc"></p>
</div>

<script>
  // All 46 key moments, oldest first. Images are optional -- if a file
  // named below isn't yet in timeline_images/, the image area just hides
  // itself rather than showing a broken image.
  const ALL_EVENTS = [{"date": "900-1100AD", "name": "Māori arrived", "description": "It is believed that between 900AD and 1100 the Māori made many journeys from Rarotonga (Cook Islands) to New Zealand.\n\nThey bought with them foods like: kumara (sweet potato), kunekune (pig) and kiore (rat).", "image": "waka.jpg", "era": "Pre-settlement (0900AD - 1300)"}, {"date": "1300s", "name": "Māori agriculture", "description": "Māori had managed to extinct 120 species of native bird and animal and burn 1000s of acres of bush.", "image": "", "era": "Māori settlement (1300-1769)"}, {"date": "1400s", "name": "Classical Māori culture", "description": "Early signs of classical Māori culture emerge as they recognise the loss of resources around them", "image": "", "era": "Māori settlement (1300-1769)"}, {"date": "13 Dec 1642", "name": "Dutch discovery", "description": "Dutch Navigator/Explorer Abel Tasman discovered New Zealand, named it Staten Landt, and then a cartographer on board Tasman’s ship the Heemskerck renamed it to Niew Zeeland after the Dutch province from which they had departed. And reported “nothing of value here”", "image": "staete-landt.jpg", "era": "European contact (1769 - 1840)"}, {"date": "6 Oct 1769", "name": "English discovery", "description": "English explorer Captain James Cook visited New Zealand and claimed us for King and country. Went home and reported “A Utopia” Although technically not a part of England till 1787.", "image": "cooks-map.png", "era": "European contact (1769 - 1840)"}, {"date": "1769", "name": "French discovery", "description": "The French (Jean de Surville) two months behind Cook had a couple of run ins with the locals who ended up killing him in the Bay of Islands.", "image": "", "era": "European contact (1769 - 1840)"}, {"date": "1790’s", "name": "First European settlers", "description": "The first settlers were here to hunt whales and fur seals.", "image": "", "era": "European contact (1769 - 1840)"}, {"date": "6 Feb 1840", "name": "Treaty of Waitangi", "description": "Treaty of Waitangi – a document that stated (in English) that ‘we would live side by side peaceably for all eternity sharing all under the command of English rule’ (or words to that effect)… in Māori ‘that we will share the country and the Māori could retain their cultural systems and rule, under the international protection of England’ (or words to that effect), Fantastic idea pity neither side had any intention of honouring it. Well the English wrote 2 versions to keep the Māori happy while they could trade/take/steal land. The Māori had no real idea what was outside these shores so what was there to protect from as well as continuing trading muskets to settle old score amongst themselves?", "image": "", "era": "Colonial (1840 - 1900)"}, {"date": "1840s", "name": "English colonisation", "description": "Europeans took land by whatever means they could. Trade, dodgy deals or just moved in.", "image": "", "era": "Colonial (1840 - 1900)"}, {"date": "17 June 1843", "name": "Wairau incident", "description": "Wairau incident Te Rauparaha and settlers had fight over land that led to 16 dead and another 12 through utu. This began the unrest that led to the New Zealand wars.", "image": "", "era": "Colonial (1840 - 1900)"}, {"date": "8 Jul 1844", "name": "Flag pole cut down", "description": "Hone Heke Māori chief cut down the English flag pole at Kororareka (Russell)", "image": "", "era": "Colonial (1840 - 1900)"}, {"date": "1845 - 1872", "name": "New Zealand Wars", "description": "As Māori attempted to protect their culture and lands, the Crown introduced laws to control the Māori.", "image": "", "era": "Colonial (1840 - 1900)"}, {"date": "14 May 1870", "name": "First Rugby game", "description": "First rugby football game in New Zealand at Nelson.\nIntroduced to the Nelson Football club (known as the Town Club) in 1868 the club had informal games of rugby amongst themselves.\nNelson College adapted the sport and created their own Nelson Club.\nNelson Club won by 2 goals over Nelson Town Club.", "image": "", "era": "Colonial (1840 - 1900)"}, {"date": "5 Nov 1881", "name": "Fall of Parihaka", "description": "While the New Zealand wars officially ended in 1872, unrest has simmered for years.\nIn Taranaki a pacifists Te Whiti and Tohu practiced peaceful protest.\nTheir actions were words and destruction of property. (roads, fences and ploughing of fields)\nThe arrest of pacifist Te Whiti at Parihaka one of the final strokes of the New Zealand wars.\nThey were held in Dunedin and were used to build Dunedin infrastructure.", "image": "", "era": "Colonial (1840 - 1900)"}, {"date": "19 Sept 1893", "name": "Women can vote", "description": "Kate Sheppard achieves for women the right to vote – first self governing country in the world to do so.\nKate Sheppard is the ‘heads’ side of the New Zealand $10 note.", "image": "", "era": "Colonial (1840 - 1900)"}, {"date": "11 Oct 1899", "name": "Boer war (South Africa)", "description": "New Zealand gets involved in Boer War – first New Zealand troops sent to defence of another country", "image": "", "era": "Colonial (1840 - 1900)"}, {"date": "31 March 1903", "name": "Powered flight achieved", "description": "Inventor Richard Pearse achieved powered flight in a heavier than air machine.\nActual date is of contention due to the loss of records in a fire. But many believe 1903 was the year he achieved flight - ahead of the Wright brothers.", "image": "", "era": "Early New Zealand (1900 - 1950)"}, {"date": "Sept 1905", "name": "All Blacks", "description": "Due to their all black uniform the rugby team representing New Zealand arrived in England and have been referred to as the All Blacks ever since.", "image": "", "era": "Early New Zealand (1900 - 1950)"}, {"date": "10 June 1906", "name": "Gods own country", "description": "Premier (Prime Minister) Richard Seddon quoted poet Thomas Bracken in a telegram from Australia to home saying that he was “returning to Gods own country’ Richard Seddon died the next day.\n“Give me, give me God’s own country There to live and there to die God’s own country, fairest region, nestling ‘neath the Southern sky.” - Thomas Bracken", "image": "", "era": "Early New Zealand (1900 - 1950)"}, {"date": "10 Dec 1908", "name": "Lord Ernest Rutherford", "description": "1908 New Zealand born Nuclear physicist Lord Ernest Rutherford awarded Nobel Prize in Chemistry.\n1911Rutherford theorised the shape of the atom as we understand it today.\n1917 performed the first nuclear reaction.\nLord Ernest Rutherford is the ‘heads’ side of the $100 note.", "image": "", "era": "Early New Zealand (1900 - 1950)"}, {"date": "28 Jul 1914", "name": "WWI started", "description": "England accepts New Zealand's offer of assistance.", "image": "", "era": "Early New Zealand (1900 - 1950)"}, {"date": "25 April 1915", "name": "Gallipoli invasion", "description": "New Zealand cements its place in history by landing as part of the British led invasion at a place now called ANZAC (Australia New Zealand Army Corp) Cove, Gallipoli, Turkey. \nAlthough not New Zealand’s worst massacre of Kiwi troops (that goes to Passchendaele in Belgium – October the same year), Gallipoli saw 11,600 New Zealanders serve, 2721 killed and 4752 wounded. \nBy the end of the war: 130,000 served, 16,710 killed, 41,320 wounded with total county population 1.05 million.", "image": "anzac.jpg", "era": "Early New Zealand (1900 - 1950)"}, {"date": "1937", "name": "Possums introduced", "description": "Introduction of the brush tail possum from Australia to help create a fur trade.", "image": "", "era": "Early New Zealand (1900 - 1950)"}, {"date": "3 Sept 1939", "name": "WWII Started", "description": "New Zealand declares (with England) war on Germany", "image": "", "era": "Early New Zealand (1900 - 1950)"}, {"date": "15 Aug 1945", "name": "Victory over Japan WWII", "description": "World War 2 ends: 140,000 served, 12,200 killed, 19,300 wounded, total NZ population 1.6 million", "image": "", "era": "Early New Zealand (1900 - 1950)"}, {"date": "25 Nov 1947", "name": "Independence from England", "description": "New Zealand ratify the Statute of Westminster (Australia and other dominions of England did this in 1931).\nThe Statute of Westminster gives equal value of the dominions governments as that of England, up till this point was a self-governing dominion of England. In short New Zealand is now an independent country.", "image": "", "era": "Early New Zealand (1900 - 1950)"}, {"date": "29 May 1953", "name": "Mt Everest climbed", "description": "New Zealander Sir Edmund Hillary and Nepalese Sherpa Tenzing Norgay summated Mt Everest.\nSir Edmund Hillary is the ‘heads’ side of the $5 note.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "10 Jul 1967", "name": "Decimal system", "description": "New Zealand converted from the English imperial system of measurements and currency to the decimal system.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "9 Oct 1967", "name": "6 O’clock swill gone", "description": "Change of the alcohol laws, allowed bars to remain open until 10pm. \nA law based on prohibition came into place in 1917 which enforced opening hours of licensed premises: 10.30am to 6pm. \nFrom 1917 to 1967 of a lot of male workers, left work at 5pm then headed to the hotel to drink as much as they could before closing at 6pm. The period from 5pm till 6pm became known as the 6 o’clock swill.\nWe still feel the effects of the law with a binge drinking culture it helped create.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "14 Sept 1975", "name": "Māori land march", "description": "Led by Māori leader Dame Whina Cooper at the age of 80, protesters walked from Cape Reinga to Wellington in peaceful protest of land issues.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "12 Dec 1975", "name": "Sir Robert Muldoon", "description": "Robert Muldoon becomes Prime Minister during his reign launches “think big” which led to the completion of Manapouri power station and the creation of Bastion Point oil refinery, Motonui gas to gasoline plant, Clyde Dam hydro power project. A policy to get New Zealand further ahead in energy production… also got the country in to a power of debt.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "21 Jan 1980", "name": "Split Enz", "description": "Split Enz release “True Colours” album containing Neil Finn's song “I got you” this song got to #1 in Australia, Canada, NZ #11 in Britain and a whopping #53 in the USA (the highest any NZ band had got to in the states, up to this point)", "image": "split-enz-true-colours.jpg", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "1 Feb 1981", "name": "Thats not cricket", "description": "In the World Cup Cricket tournament hosted in Australia. At the completion of a one day game between New Zealand and Australia, New Zealand needed 6 runs to draw the game, off the final delivery. \nThe Australian bowler bowled the final delivery under arm along the ground. Meaning there was no way the New Zealand batter could hit the ball over the boundary to be awarded 6 runs. \nThis has been the cause much teasing by Kiwis over the Australians ever since... not that we’re too bitter about it!", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "19 Jul 1981", "name": "Controversial Spring Book rugby tour", "description": "With growing international lack of support for South Africa’s apartheid and New Zealand’s own growing awareness of its multi-cultural society. The calls to have a rugby tour by South Africa stopped are ignored by the government.\nThis led to violent clashes between police and anti-tour protestors. So much so that when protestors stormed the field in Hamilton prior to a game against the Waikato provincial team the game had to be cancelled. \nAfter the tour no New Zealand sports teams were allowed to tour South Africa or South African sports teams tour New Zealand until the end of apartheid.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "July 1984", "name": "Economic reform", "description": "Minister of Finance Roger Douglas launches “Rogernomics” a radical economic policy that removed subsidies on farmers and introduced GST. Caused many farmers to go bankrupt. In retrospect a brilliant move as now we have a very strong efficient farming industry. At the time… a tad painful for the farmers.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "4 Feb 1985", "name": "No nukes", "description": "The Government launch the Anti-nuclear policy that leads to a stand off at our oceanic border with the USS Buchanan as America refused to say whether or not she was carrying nuclear weapons or nuclear powered. So we denied entry to our ports. We got kicked out of ANZUS (Australia New Zealand United States) agreement of support.", "image": "no-nukes.jpg", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "10 Jul 1985", "name": "Bombing of Rainbow Warrior", "description": "French spies got inside a Greenpeace protest ship, planted a bomb and ‘accidentally’ killed one person onboard as the bomb went off, sinking the ship.\nNew Zealand got tough and stopped importing French goods (Direct result our wines got lot better to fill the gap). \nAs part of reconciliation for the act until creation of EU, New Zealanders didn’t need a visa to enter France.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "20 Oct 1986", "name": "Don’t dream it’s over", "description": "Australian band Crowded House fronted by and most of the music written by former Split Enz and kiwi Neil Finn, released their self-titled album.\n\nThe album containing the song “Don’t dream it's over”. The song got to #1 in New Zealand, Canada, #27 United Kingdom, #8 Australia, #6 Norway, #2 USA. At the time the highest ranked song by a New Zealander internationally.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "8 June 1987", "name": "Officially nuclear free", "description": "New Zealand Nuclear Free Zone, Disarmament, and Arms Control Act ratified.", "image": "no-nukes.jpg", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "8 Nov 1987", "name": "Inaugural Rugby World Cup", "description": "New Zealand & Australia co-host inaugural Rugby World Cup.\nFinal played in Auckland New Zealand winning 29 against France 9.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "14 May 1995", "name": "Win Americas Cup", "description": "Team New Zealand wins Americas cup yachting race in Perth Australia. Having been involved in the competition for many years prior as parts of other teams, New Zealand now as a New Zealand team.\nTeam New Zealand have become one of the big teams in the Americas Cup tournaments.", "image": "", "era": "Modern New Zealand (1950 - 2000)"}, {"date": "19 Dec 2001", "name": "Lord of the rings - Fellowship of the ring", "description": "First movie of Peter Jackson's Lord of the Rings trilogy released launching New Zealand further as a tourist destination.", "image": "", "era": "Recent (2000 - )"}, {"date": "22 Feb 2011", "name": "Christchurch quake", "description": "Just 5 months after the 4 Sept 7.1 Mw Darfield quake to the west of Christchurch, the region shook again.\nThe magnitude 6.3Mw depth 5km hits 10km south east of Christchurch killing 185, this quake caused severe damage to the city centre, including the iconic cathedral.", "image": "", "era": "Recent (2000 - )"}, {"date": "14 Nov 2016", "name": "Kaikōura quake", "description": "The 7.8Mw quake at a depth 15km shook a series of fault lines around Kaikōura, killing 2. \nThese quakes moved the earth ±7m averaging a 12m range in motion, changed the landscape through multiple slips. \nThe coastline was lifted to a new height of 6m above previous levels. Initially devastating the shoreline wildlife, over time it is now returning.", "image": "", "era": "Recent (2000 - )"}, {"date": "15 March 2019", "name": "Christchurch Mosque shootings", "description": "The racially charged two consecutive mass shootings at the mosques of Linwood and Riccarton in Christchurch. The gunman killed 51 at prayer parishioners of the mosques. \nEchoing the public outcry to the horror that this could happen in our piece of paradise, Prime Minister Jacinda Ardern commented in a press conference “We were not a target because we are a safe harbour for those who hate. We were not chosen for this act of violence because we condone racism, because we are an enclave for extremism. We were chosen for the very fact that we are none of these things.”. \nWith signs popping up simply say “This is not us” the event was a bitter pill for most of New Zealand to accept that this kind of hatred could get to this level in NZ.", "image": "they-are-one-of-us.jpg", "era": "Recent (2000 - )"}, {"date": "2020/2021", "name": "Global pandemic", "description": "Most of 2020 and 2021 was spent in and out of public lockdowns of various levels affecting different regions at different times as the country tried to protect the health system from the onslaught of the SARS CoV-2 COVID-19 virus. \nWhile for a long time NZ sat in lower 10 countries for deaths/population by 2023 when the pandemic was declared over NZ sat 112th (of 193) with a total of 2550 deaths (53/100,000 pop).", "image": "", "era": "Recent (2000 - )"}];

  const drumTrack = document.getElementById('drum-track');
  const searchInput = document.getElementById('timeline-search');
  const searchStatus = document.getElementById('search-status');
  const detailEl = document.getElementById('timeline-detail');
  const eraEl = document.getElementById('detail-era');
  const dateEl = document.getElementById('detail-date');
  const nameEl = document.getElementById('detail-name');
  const imageEl = document.getElementById('detail-image');
  const descEl = document.getElementById('detail-desc');

  let visibleEvents = ALL_EVENTS.slice();
  let currentIndex = 0;

  function renderDrum(preserveEvent) {
    drumTrack.innerHTML = '';

    if (!visibleEvents.length) {
      const empty = document.createElement('div');
      empty.className = 'drum-empty';
      empty.textContent = 'No events match your search.';
      drumTrack.appendChild(empty);
      detailEl.style.display = 'none';
      return;
    }
    detailEl.style.display = 'block';

    visibleEvents.forEach((ev, i) => {
      const item = document.createElement('div');
      item.className = 'drum-item';
      item.dataset.index = i;
      item.innerHTML =
        '<p class="drum-item-kind">' + ev.date + '</p>' +
        '<p class="drum-item-name">' + ev.name + '</p>';
      item.addEventListener('click', () => scrollDrumTo(i));
      drumTrack.appendChild(item);
    });

    // Try to keep the same event centered after a re-render (e.g. search
    // narrows the list); otherwise land on the first result.
    let targetIndex = 0;
    if (preserveEvent) {
      const found = visibleEvents.findIndex(e => e.name === preserveEvent.name && e.date === preserveEvent.date);
      if (found !== -1) targetIndex = found;
    }
    requestAnimationFrame(() => scrollDrumTo(targetIndex, true));
  }

  function scrollDrumTo(index, instant) {
    const items = drumTrack.querySelectorAll('.drum-item');
    if (!items.length) return;
    const item = items[index];
    if (!item) return;
    const targetTop = item.offsetTop - (drumTrack.clientHeight / 2) + (item.clientHeight / 2);
    drumTrack.scrollTo({ top: targetTop, behavior: instant ? 'auto' : 'smooth' });
  }

  let drumScrollTimeout = null;
  drumTrack.addEventListener('scroll', () => {
    if (drumScrollTimeout) clearTimeout(drumScrollTimeout);
    drumScrollTimeout = setTimeout(updateCenteredEvent, 80);
  });

  function updateCenteredEvent() {
    const items = Array.from(drumTrack.querySelectorAll('.drum-item'));
    if (!items.length) return;
    const trackMid = drumTrack.scrollTop + drumTrack.clientHeight / 2;
    let closest = 0;
    let closestDist = Infinity;
    items.forEach((item, i) => {
      const itemMid = item.offsetTop + item.clientHeight / 2;
      const dist = Math.abs(itemMid - trackMid);
      if (dist < closestDist) { closestDist = dist; closest = i; }
      item.classList.toggle('centered', dist < item.clientHeight / 2);
    });
    if (closest !== currentIndex) currentIndex = closest;
    renderDetail();
  }

  function renderDetail() {
    const ev = visibleEvents[currentIndex];
    if (!ev) return;
    eraEl.textContent = ev.era;
    dateEl.textContent = ev.date;
    nameEl.textContent = ev.name;
    descEl.textContent = ev.description;

    if (ev.image) {
      imageEl.src = 'timeline_images/' + ev.image;
      imageEl.alt = ev.name;
      imageEl.style.display = 'block';
      imageEl.onerror = function() { imageEl.style.display = 'none'; };
    } else {
      imageEl.style.display = 'none';
      imageEl.removeAttribute('src');
    }
  }

  // ---- Search ----
  let searchTimeout = null;
  searchInput.addEventListener('input', () => {
    if (searchTimeout) clearTimeout(searchTimeout);
    searchTimeout = setTimeout(runSearch, 150);
  });

  function runSearch() {
    const q = searchInput.value.trim().toLowerCase();
    const previouslyCentered = visibleEvents[currentIndex];

    if (!q) {
      visibleEvents = ALL_EVENTS.slice();
      searchStatus.innerHTML = '&nbsp;';
    } else {
      visibleEvents = ALL_EVENTS.filter(ev =>
        ev.name.toLowerCase().includes(q) ||
        ev.description.toLowerCase().includes(q) ||
        ev.date.toLowerCase().includes(q)
      );
      searchStatus.textContent = visibleEvents.length
        ? visibleEvents.length + ' event' + (visibleEvents.length === 1 ? '' : 's') + ' found'
        : 'No events match "' + searchInput.value.trim() + '"';
    }

    currentIndex = 0;
    renderDrum(q ? null : previouslyCentered);
  }

  // Initial render
  renderDrum();
  requestAnimationFrame(() => setTimeout(updateCenteredEvent, 50));
</script>

</body>
</html>
